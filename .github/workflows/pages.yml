name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site/fonts _site/assets/brand
          cp index.html data-prototype.html alliance-daily-report.html .nojekyll _site/
          if [ -f fonts/NotoSansSC-VF.ttf ]; then cp fonts/NotoSansSC-VF.ttf _site/fonts/; fi
          if [ -d assets/brand ]; then cp -r assets/brand/. _site/assets/brand/; fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
