  const def = ICON_SVG[name];
  if (!def) return null;
  const col = color || def.color;
  return (
    <svg
      width={size}
      height={size}
      viewBox={def.vb}
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      style={{ display: "block", flexShrink: 0, color: col, ...style }}
      aria-hidden="true"
      dangerouslySetInnerHTML={{ __html: def.body }}
    />
  );
}

async function copyMarkdown(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fallback */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

function useCopyToast() {
  const [toast, setToast] = useState("");
  const showCopied = async (md) => {
    const ok = await copyMarkdown(md);
    if (ok) {
      setToast("报表已复制到粘贴板");
      window.clearTimeout(useCopyToast._t);
      useCopyToast._t = window.setTimeout(() => setToast(""), 2000);
    }
  };
  return { toast, showCopied };
}

    let list = STORE_DATA[metric] || [];

          (s.phones || []).forEach(([phone, n]) => {
            lines.push(`  - ${phone} · ${n}次`);
          });
        });
        lines.push("");
      });
    } else {
      lines.push(`筛选：${storeDate === "全部" ? "全部日期" : storeDate} · ${metric}`);
      lines.push("");
      shops.forEach((card) => {
        const amt = withAmt && card.amount != null ? ` · ${fmtAmt(card.amount)}` : "";
        lines.push(`## ${card.shop} · ${card.count}${unit}${amt}`);
        (card.phones || []).forEach(([phone, n]) => {
          lines.push(`- ${phone} · ${n}次`);
        });
        lines.push("");
      });
    }
    return lines.join("\n").trim() + "\n";

/* —— 21 本店漏斗明细 —— */
function ManagerDetail({ metric: initMetric, onBack, onOpenDay, onOpenStaff }) {
  const [tab, setTab] = useState("按日");
  const [metric, setMetric] = useState(initMetric || "被核销");
  const [range, setRange] = useState("近7天");
  const [sheet, setSheet] = useState(null);
  const [openKey, setOpenKey] = useState("11月03日");
  const unit = unitOf(metric);
  const withAmt = showAmount(metric);
  const clickable = metric === "被核销";
  const days = MG_FUNNEL_DAY[metric] || [];
  const staffs = MG_FUNNEL_STAFF[metric] || [];
  const { toast, showCopied } = useCopyToast();

  const buildMgrMarkdown = () => {
    const lines = [];
    lines.push(`# 本店明细 · ${MY_STORE}`);
    lines.push(`筛选：${range} · ${metric} · ${tab}`);
    lines.push("");
    if (tab === "按日") {
      days.forEach((day) => {
        const amt = withAmt && day.amount != null ? ` · ${fmtAmt(day.amount)}` : "";
        lines.push(`## ${day.date} · ${day.total}${unit}${amt}`);
        (day.staff || []).forEach(([phone, n]) => {
          lines.push(`- ${phone} · ${n}次`);
        });
        lines.push("");
      });
    } else {
      staffs.forEach((s) => {
        const amt = withAmt && s.amount != null ? ` · ${fmtAmt(s.amount)}` : "";
        lines.push(`## ${s.phone} · ${s.count}${unit}${amt}`);
        (s.days || []).forEach(([d, n]) => {
          lines.push(`- ${d} · ${n}次`);
        });
        lines.push("");
      });
    }
    return lines.join("\n").trim() + "\n";
  };

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", background: PAGE, position: "relative" }}>
      <StatusBar />
      <TitleBar title="本店明细" subtitle={MY_STORE} onBack={onBack} onCopy={() => showCopied(buildMgrMarkdown())} />
      <div style={{ display: "flex", justifyContent: "center", gap: 24, background: PAPER, borderBottom: `1px solid ${LINE}` }}>
        {["按日", "按员工"].map((name) => {
          const on = tab === name;
          return (
            <button key={name} type="button" onClick={() => setTab(name)}
              style={{ appearance: "none", border: "none", background: "transparent", padding: "10px 0 12px", fontSize: 15, fontWeight: on ? 600 : 400, color: on ? ORANGE : MUTED, borderBottom: on ? `2px solid ${ORANGE}` : "2px solid transparent", cursor: "pointer" }}>
              {name}
            </button>
          );
        })}
      </div>
      <div style={{ display: "flex", gap: 8, padding: "10px 16px" }}>
        <FilterChip label={range} onClick={() => setSheet("time")} />
        <FilterChip label={metric} active onClick={() => setSheet("metric")} />
      </div>
      <div style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: "0 16px 16px" }}>
        {tab === "按日" ? days.map((day, i) => {
          const open = openKey === day.date;
          return (
            <div key={day.date} style={{ marginTop: i ? 10 : 0 }}>
              <Card>
                <button type="button" onClick={() => setOpenKey(open ? "" : day.date)}
                  style={{ appearance: "none", border: "none", background: "transparent", width: "100%", display: "flex", alignItems: "flex-end", padding: "14px 16px", cursor: "pointer" }}>
                  <span style={{ flex: 1, fontSize: 15, fontWeight: 600, textAlign: "left", lineHeight: "22px" }}>{day.date}</span>
                  <span style={{ width: 72, textAlign: "right", fontSize: 15, fontWeight: 700, color: ORANGE, lineHeight: "22px" }}>{day.total}{unit}</span>
                  {withAmt ? <span style={{ width: 88, textAlign: "right", fontSize: 15, fontWeight: 700, lineHeight: "22px" }}>{fmtAmt(day.amount)}</span> : null}
                  <span style={{ width: 20, paddingLeft: 8 }}><Icon name={open ? "chevron-up.svg" : "chevron-down.svg"} size={12} /></span>
                </button>
                {open ? day.staff.map(([phone, n]) => (
                  <button key={phone} type="button"
                    onClick={() => {
                      if (clickable) onOpenDay({ date: day.date, shop: MY_STORE, clerk: phone });
                      else onOpenStaff(phone);
                    }}
                    style={{ appearance: "none", border: "none", borderTop: `1px solid ${LINE}`, background: "transparent", width: "100%", display: "flex", alignItems: "center", padding: "12px 16px 12px 32px", cursor: "pointer", textAlign: "left" }}>
                    <span style={{ flex: 1, fontSize: 13, color: "#666" }}>{phone}</span>
                    <span style={{ fontSize: 13, marginRight: 6 }}>{n}次</span>
                    <Icon name="chevron-right.svg" size={12} />
                  </button>
                )) : null}
              </Card>
            </div>
          );
        }) : staffs.map((s, i) => {
          const open = openKey === s.phone;
          return (
            <div key={s.phone} style={{ marginTop: i ? 10 : 0 }}>
              <Card>
                <button type="button" onClick={() => setOpenKey(open ? "" : s.phone)}
                  style={{ appearance: "none", border: "none", background: "transparent", width: "100%", display: "flex", alignItems: "flex-end", padding: "14px 16px", cursor: "pointer" }}>
                  <span style={{ flex: 1, fontSize: 15, fontWeight: 600, textAlign: "left", lineHeight: "22px" }}>{s.phone}</span>
                  <span style={{ width: 72, textAlign: "right", fontSize: 15, fontWeight: 700, color: ORANGE, lineHeight: "22px" }}>{s.count}{unit}</span>
                  {withAmt ? <span style={{ width: 88, textAlign: "right", fontSize: 15, fontWeight: 700, lineHeight: "22px" }}>{fmtAmt(s.amount)}</span> : null}
                  <span style={{ width: 20, paddingLeft: 8 }}><Icon name={open ? "chevron-up.svg" : "chevron-down.svg"} size={12} /></span>
                </button>
                {open ? (
                  <>
                    {s.days.map(([d, n]) => (
                      <button key={d} type="button"
                        onClick={() => { if (clickable) onOpenDay({ date: d, shop: MY_STORE, clerk: s.phone }); }}
                        style={{ appearance: "none", border: "none", borderTop: `1px solid ${LINE}`, background: "transparent", width: "100%", display: "flex", alignItems: "center", padding: "12px 16px 12px 32px", cursor: clickable ? "pointer" : "default", textAlign: "left" }}>
                        <span style={{ flex: 1, fontSize: 13, color: "#666" }}>{d}</span>
                        <span style={{ fontSize: 13, marginRight: clickable ? 6 : 0 }}>{n}次</span>
                        {clickable ? <Icon name="chevron-right.svg" size={12} /> : null}
                      </button>
                    ))}
                    <button type="button" onClick={() => onOpenStaff(s.phone)}
                      style={{ appearance: "none", border: "none", borderTop: `1px solid ${LINE}`, background: CHIP, width: "100%", padding: "12px 16px", fontSize: 13, color: ORANGE, fontWeight: 600, cursor: "pointer" }}>
                      查看员工详情
                    </button>
                  </>
                ) : null}
              </Card>
            </div>
          );
        })}
      </div>
      {sheet === "time" ? <Sheet title="选择时间范围" options={TIME_OPTS} value={range} onPick={(v) => { setRange(v); setSheet(null); }} onClose={() => setSheet(null)} /> : null}
      {sheet === "metric" ? <Sheet title="选择漏斗态" options={METRICS} value={metric} onPick={(v) => { setMetric(v); setSheet(null); }} onClose={() => setSheet(null)} /> : null}
      <Toast message={toast} />
    </div>
  );
}

/* —— 22 员工详情 —— */
function ManagerStaff({ phone, onBack, onOpenOrder }) {
  const d = MG_STAFF_DETAIL[phone] || MG_STAFF_DETAIL["138****1024"];
  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", background: PAGE }}>
      <StatusBar />
      <TitleBar title="员工详情" subtitle={MY_STORE} onBack={onBack} />
      <div style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: 16 }}>
        <Card style={{ padding: 16 }}>
          <div style={{ fontSize: 18, fontWeight: 600, color: INK }}>{phone}</div>
          <div style={{ marginTop: 4, fontSize: 12, color: MUTED }}>{d.role} · 近7天</div>
          <div style={{ marginTop: 12, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            {d.kpi.map(([k, v]) => (
              <div key={k} style={{ background: PAGE, borderRadius: 8, padding: "10px 8px" }}>
                <div style={{ fontSize: 11, color: MUTED }}>{k}</div>
                <div style={{ marginTop: 4, fontSize: 16, fontWeight: 700, color: ORANGE }}>{v}</div>
              </div>
            ))}
          </div>
        </Card>
        <Card style={{ marginTop: 12, padding: 16 }}>
          <div style={{ fontSize: 14, fontWeight: 600 }}>近3日趋势</div>
          <div style={{ marginTop: 12, display: "flex", alignItems: "flex-end", gap: 16, height: 80 }}>
            {d.trend.map(([lab, n]) => (
              <div key={lab} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end", height: "100%" }}>
                <div style={{ width: "100%", maxWidth: 36, height: `${Math.max(12, n * 22)}px`, background: ORANGE, borderRadius: 4 }} />
                <div style={{ marginTop: 6, fontSize: 11, color: MUTED }}>{lab}</div>
              </div>
            ))}
          </div>
        </Card>
        <Card style={{ marginTop: 12, padding: "4px 16px 8px" }}>
          <div style={{ padding: "12px 0 4px", fontSize: 14, fontWeight: 600 }}>操作流水</div>
          {d.logs.map((log, i) => (
            <button key={log.t + i} type="button"
              onClick={() => { if (log.orderId) onOpenOrder(log.orderId); }}
              style={{ appearance: "none", border: "none", borderTop: `1px solid ${LINE}`, background: "transparent", width: "100%", padding: "12px 0", display: "flex", alignItems: "center", cursor: log.orderId ? "pointer" : "default", textAlign: "left" }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 600 }}>{log.act}</div>
                <div style={{ marginTop: 2, fontSize: 12, color: MUTED }}>{log.t} · {log.note}</div>
              </div>
              {log.orderId ? <Icon name="chevron-right.svg" size={12} /> : null}
            </button>
          ))}
        </Card>
      </div>
    </div>
  );
}

function initialRoute() {
  const q = new URLSearchParams(location.search);
  const screen = q.get("screen");
  if (screen === "mgrHome") return { mode: "manager", stack: [{ name: "mgrHome" }] };
  if (screen === "mgrDetail") return { mode: "manager", stack: [{ name: "mgrDetail", metric: q.get("metric") || "被核销" }] };
  if (screen === "mgrStaff") return { mode: "manager", stack: [{ name: "mgrStaff", phone: q.get("phone") || "138****1024" }] };
  return { mode: "alliance", stack: [{ name: "stats" }] };
}

function App() {
  const boot = initialRoute();
  const [mode, setMode] = useState(boot.mode);
  const [stack, setStack] = useState(boot.stack);
  const top = stack[stack.length - 1];
  const push = (frame) => setStack((s) => [...s, frame]);
  const pop = () => setStack((s) => (s.length > 1 ? s.slice(0, -1) : s));

  const toggleMode = () => {
    if (mode === "alliance") {
      setMode("manager");
      setStack([{ name: "mgrHome" }]);
    } else {
      setMode("alliance");
      setStack([{ name: "stats" }]);
    }
  };

  if (top.name === "stats") {
    return <StatsScreen mode={mode} onToggleMode={toggleMode} onOpenLogs={({ side, metric }) => push({ name: "logs", side, metric })} />;
  }
  if (top.name === "logs") {
    return <LogsScreen side={top.side} metric={top.metric} onBack={pop} onOpenDay={(ctx) => push({ name: "day", ...ctx })} />;
  }
  if (top.name === "mgrHome") {
    return (
      <ManagerHome
        mode={mode}
        onToggleMode={toggleMode}
        onOpenDetail={(metric) => push({ name: "mgrDetail", metric })}
        onOpenStaff={(phone) => push({ name: "mgrStaff", phone })}
      />
    );
  }
  if (top.name === "mgrDetail") {
    return (
      <ManagerDetail
        metric={top.metric}
        onBack={pop}
        onOpenDay={(ctx) => push({ name: "day", ...ctx })}
        onOpenStaff={(phone) => push({ name: "mgrStaff", phone })}
      />
    );
  }
  if (top.name === "mgrStaff") {
    return <ManagerStaff phone={top.phone} onBack={pop} onOpenOrder={(orderId) => push({ name: "order", orderId })} />;
  }
  if (top.name === "day") {
    return (
      <DayDetailScreen
        date={top.date} shop={top.shop} clerk={top.clerk}
        onBack={pop}
        onOpenOrder={(orderId) => push({ name: "order", orderId })}
      />
    );
  }
  if (top.name === "order") {
    return <OrderDetailScreen orderId={top.orderId} onBack={pop} />;
  }
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
/* run-on-phone — adapted for .page + #root.phone */
(function () {
  var CONFIG = {
    logicalWidth: 390,
    logicalHeightFallback: 844,
    minLogicalHeight: 500,
    frameSelector: "#root",
    stageSelector: ".page",
    navSelector: "#siteNav",
    scrimSelector: "#siteNavScrim",
    edge: 24,
    openDx: 56,
    closeDx: -48,
    kbJitterPx: 80
  };

  var root = document.documentElement;
  var nav = document.querySelector(CONFIG.navSelector);
  var scrim = document.querySelector(CONFIG.scrimSelector);
  var stage = document.querySelector(CONFIG.stageSelector);

  function queryForce() {
    try {
      var q = new URLSearchParams(location.search).get("mobile");
      if (q === "1" || q === "true") return true;
      if (q === "0" || q === "false") return false;
    } catch (e) {}
    return null;
  }

  function isRealPhone() {
    var ua = navigator.userAgent || "";
    if (/Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua)) {
      if (/Android/i.test(ua) && !/Mobile/i.test(ua)) return false;
      return true;
    }
    if (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) return true;
    return false;
  }

  function shouldMobile() {
    var force = queryForce();
    if (force !== null) return force;
    return isRealPhone();
  }

  function isNavOpen() {
    return root.classList.contains("is-nav-open");
  }

  function openSiteNav() {
    if (!root.classList.contains("is-mobile")) return;
    root.classList.add("is-nav-open");
    if (scrim) scrim.setAttribute("aria-hidden", "false");
  }

  function closeSiteNav() {
    root.classList.remove("is-nav-open");
    if (scrim) scrim.setAttribute("aria-hidden", "true");
  }

  window.openSiteNav = openSiteNav;
  window.closeSiteNav = closeSiteNav;

  function updateScale() {
    if (!root.classList.contains("is-mobile") || !stage) return;
    var w = stage.clientWidth || window.innerWidth;
    var h = stage.clientHeight || window.innerHeight;
    var lw = CONFIG.logicalWidth;
    var lh0 = CONFIG.logicalHeightFallback;
    var scale = w / lw;
    var logicalH = scale > 0 ? h / scale : h;
    if (!isFinite(logicalH) || logicalH < CONFIG.minLogicalHeight) {
      scale = Math.min(w / lw, h / lh0);
      logicalH = lh0;
    }
    if (!isFinite(scale) || scale <= 0) scale = 1;
    root.style.setProperty("--mobile-scale", String(Math.round(scale * 1000) / 1000));
    root.style.setProperty("--mobile-h", Math.round(logicalH) + "px");
  }

  function updateKeyboardInset() {
    if (!root.classList.contains("is-mobile")) return;
    var vv = window.visualViewport;
    if (!vv) {
      root.style.setProperty("--kb-h", "0px");
      return;
    }
    var overlap = window.innerHeight - vv.height - (vv.offsetTop || 0);
    if (!isFinite(overlap) || overlap < 0) overlap = 0;
    var scale = parseFloat(root.style.getPropertyValue("--mobile-scale")) || 1;
    if (!isFinite(scale) || scale <= 0) scale = 1;
    var logical = overlap > CONFIG.kbJitterPx ? overlap / scale : 0;
    root.style.setProperty("--kb-h", Math.round(logical) + "px");
  }

  function applyMode() {
    var on = shouldMobile();
    root.classList.toggle("is-mobile", on);
    if (!on) {
      closeSiteNav();
      root.style.removeProperty("--mobile-scale");
      root.style.removeProperty("--mobile-h");
      root.style.removeProperty("--kb-h");
      return;
    }
    updateScale();
    updateKeyboardInset();
  }

  if (scrim) {
    scrim.addEventListener("click", function () {
      closeSiteNav();
    });
  }

  var track = null;
  function onTouchStart(e) {
    if (!root.classList.contains("is-mobile")) return;
    if (!nav) return;
    if (e.touches.length !== 1) return;
    var t = e.touches[0];
    var open = isNavOpen();
    if (!open && t.clientX > CONFIG.edge) return;
    track = { x0: t.clientX, y0: t.clientY, open: open, locked: false, axis: null };
  }
  function onTouchMove(e) {
    if (!track) return;
    var t = e.touches[0];
    var dx = t.clientX - track.x0;
    var dy = t.clientY - track.y0;
    if (!track.locked) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      track.axis = Math.abs(dx) >= Math.abs(dy) ? "x" : "y";
      track.locked = true;
      if (track.axis === "y") {
        track = null;
        return;
      }
    }
    if (track.axis === "x" && e.cancelable) e.preventDefault();
  }
  function onTouchEnd(e) {
    if (!track) return;
    var t = (e.changedTouches && e.changedTouches[0]) || null;
    var dx = t ? t.clientX - track.x0 : 0;
    var open = track.open;
    var axis = track.axis;
    track = null;
    if (axis !== "x") return;
    if (!open && dx >= CONFIG.openDx) openSiteNav();
    else if (open && dx <= CONFIG.closeDx) closeSiteNav();
  }

  document.addEventListener("touchstart", onTouchStart, { passive: true, capture: true });
  document.addEventListener("touchmove", onTouchMove, { passive: false, capture: true });
  document.addEventListener("touchend", onTouchEnd, { passive: true, capture: true });
  document.addEventListener("touchcancel", function () { track = null; }, { passive: true });

  applyMode();
  window.addEventListener("resize", function () {
    if (root.classList.contains("is-mobile")) {
      updateScale();
      updateKeyboardInset();
    }
  }, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", function () {
      updateScale();
      updateKeyboardInset();
    }, { passive: true });
    window.visualViewport.addEventListener("scroll", updateKeyboardInset, { passive: true });
  }
})();
</script>
</body>
</html>
