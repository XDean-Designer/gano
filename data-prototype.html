        })}
      </div>

      <div style={{ display: "flex", gap: 8, padding: "10px 16px", overflowX: "auto", flexShrink: 0 }}>
        {tab === "每日" ? (
          <>
            <FilterChip label={timeRange} active onClick={() => openSheet("time")} />
            <FilterChip label={metric} active onClick={() => openSheet("metric")} />
            <FilterChip label={store} onClick={() => openSheet("store")} />
          </>
        ) : (
          <>
            <FilterChip label={storeDate === "全部" ? "全部日期" : storeDate} active onClick={() => openSheet("date")} />
            <FilterChip label={metric} active onClick={() => openSheet("metric")} />
          </>
        )}
      </div>

      <div style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: "0 12px 16px" }}>
        {tab === "每日" ? (
          days.length === 0 ? (
            <Empty />
          ) : days.map((day) => {
            const dayOpen = openDay === day.date;
            return (
              <div key={day.date} style={{ background: PAPER, borderRadius: 10, marginBottom: 10, overflow: "hidden" }}>
                <button type="button" onClick={() => setOpenDay(dayOpen ? "" : day.date)}
                  style={{ appearance: "none", border: "none", background: "transparent", width: "100%", display: "flex", alignItems: "center", padding: "14px 16px", cursor: "pointer" }}>
                  <span style={{ flex: 1, fontSize: 15, fontWeight: 600, textAlign: "left" }}>{day.date}</span>
                  <span style={{ fontSize: 15, fontWeight: 700, color: ORANGE, marginRight: 8 }}>{day.total}{unit}</span>
                  {withAmt ? <span style={{ fontSize: 15, fontWeight: 700, marginRight: 8 }}>¥{day.amount}</span> : null}
                  <ChevronDown rotate={dayOpen ? 180 : 0} />
                </button>
                {dayOpen ? day.stores.map((s) => {
                  const key = day.date + "|" + s.name;
                  const expanded = !!openStoreL2[key];
                  return (
                    <div key={s.name}>
                      <button type="button" onClick={() => toggleL2(key)}
                        style={{ appearance: "none", border: "none", borderTop: `1px solid ${LINE}`, background: "transparent", width: "100%", display: "flex", alignItems: "center", padding: "12px 16px", cursor: "pointer" }}>
                        <span style={{ flex: 1, fontSize: 14, textAlign: "left" }}>{s.name}</span>
                        <span style={{ fontSize: 14, marginRight: 8 }}>{s.count}{unit}</span>
                        {withAmt && s.amount != null ? <span style={{ fontSize: 14, marginRight: 8 }}>¥{s.amount}</span> : null}
                        <ChevronDown rotate={expanded ? 180 : -90} />
                      </button>
                      {expanded ? renderPhones(s.phones, { date: day.date, shop: s.name }) : null}
                    </div>
                  );
                }) : null}
              </div>
            );
          })
        ) : (
          shops.map((card) => {
            const isOpen = openShop === card.shop;
            return (
              <div key={card.shop} style={{ background: PAPER, borderRadius: 10, marginBottom: 10, overflow: "hidden" }}>
                <button type="button" onClick={() => setOpenShop(isOpen ? "" : card.shop)}
                  style={{ appearance: "none", border: "none", background: "transparent", width: "100%", display: "flex", alignItems: "center", padding: "14px 16px", cursor: "pointer" }}>
                  <span style={{ flex: 1, fontSize: 15, fontWeight: 600, textAlign: "left" }}>{card.shop}</span>
                  <span style={{ fontSize: 15, fontWeight: 700, color: ORANGE, marginRight: 8 }}>{card.count}{unit}</span>
                  {withAmt ? <span style={{ fontSize: 15, fontWeight: 700, marginRight: 8 }}>¥{card.amount}</span> : null}
                  <ChevronDown rotate={isOpen ? 180 : 0} />
                </button>
                {isOpen ? renderPhones(card.phones, { date: storeDate === "全部" ? "11月03日" : storeDate, shop: card.shop }) : null}
              </div>
            );
          })
        )}
        <div style={{ marginTop: 4, fontSize: 11, color: MUTED, lineHeight: "16px", padding: "0 4px" }}>
          L3：亮码=顾问 · 扫码/领取=顾客 · 被核销=核销员（可点 › 进 12）
        </div>
      </div>

      {sheet === "time" ? <Sheet title="选择时间范围" options={TIME_OPTS} value={timeRange} onPick={(v) => { setTimeRange(v); closeSheet(); }} onClose={closeSheet} /> : null}
      {sheet === "metric" ? <Sheet title="选择漏斗态" options={METRICS} value={metric} onPick={(v) => { setMetric(v); closeSheet(); }} onClose={closeSheet} /> : null}
      {sheet === "store" ? <Sheet title="选择门店" options={STORE_OPTS} value={store} onPick={(v) => { setStore(v); closeSheet(); }} onClose={closeSheet} /> : null}
      {sheet === "date" ? <Sheet title="选择日期" options={DATE_OPTS} value={storeDate} onPick={(v) => { setStoreDate(v); closeSheet(); }} onClose={closeSheet} /> : null}
    </div>
  );
}

function Empty() {
  return (
    <div style={{ padding: "64px 24px", textAlign: "center" }}>
      <div style={{ width: 56, height: 56, borderRadius: 28, background: LINE, margin: "0 auto" }} />
      <div style={{ marginTop: 16, fontSize: 15, fontWeight: 600 }}>该筛选条件下暂无记录</div>
      <div style={{ marginTop: 8, fontSize: 12, color: MUTED }}>试试切换时间、漏斗态或门店</div>
    </div>
  );
}

/* —— 12 当日详情 —— */
function DayDetailScreen({ date, shop, clerk, onBack, onOpenOrder }) {
  const key = `${date}|${shop}|${clerk}`;
  const rows = ORDERS[key] || ORDERS["11月03日|凯德晶萃店|186****3308"];
  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", background: PAGE }}>
      <StatusBar />
      <div style={{ height: 44, flexShrink: 0, background: PAPER, display: "flex", alignItems: "center", position: "relative" }}>
        <button type="button" onClick={onBack} style={{ width: 44, height: 44, border: "none", background: "transparent", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
          <ChevronLeft />
        </button>
        <div style={{ position: "absolute", left: 72, right: 100, textAlign: "center", fontSize: 17, fontWeight: 600 }}>{date}</div>
        <div style={{ marginLeft: "auto", paddingRight: 14, fontSize: 12, color: MUTED }}>{shop}</div>
      </div>
      <div style={{ padding: "8px 16px", fontSize: 12, color: MUTED, background: PAPER, borderBottom: `1px solid ${LINE}` }}>核销人 {clerk}</div>
      <div style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: 16 }}>
        <div style={{ background: PAPER, borderRadius: 12, overflow: "hidden" }}>
          <div style={{ display: "flex", padding: "10px 16px", fontSize: 12, color: MUTED, borderBottom: `1px solid ${LINE}` }}>
            <span style={{ flex: 1.1 }}>顾客</span>
            <span style={{ flex: 1 }}>发券门店</span>
            <span style={{ flex: 1.4, textAlign: "right" }}>项目</span>
            <span style={{ width: 16 }} />
          </div>
          {rows.map((row) => (
            <button key={row.id} type="button" onClick={() => onOpenOrder(row.id)}
              style={{ appearance: "none", border: "none", borderTop: `1px solid ${LINE}`, background: "transparent", width: "100%", display: "flex", alignItems: "center", padding: "14px 16px", cursor: "pointer", textAlign: "left", gap: 8 }}>
              <span style={{ flex: 1.1, fontSize: 13, color: INK }}>{row.customer}</span>
              <span style={{ flex: 1, fontSize: 12, color: MUTED }}>{row.shop}</span>
              <span style={{ flex: 1.4, fontSize: 12, color: INK, textAlign: "right" }}>{row.item}</span>
              <ChevronDown size={12} color="#CCC" rotate={-90} />
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

/* —— 13 订单明细 —— */
function OrderDetailScreen({ orderId, onBack }) {
  const d = ORDER_DETAIL[orderId] || ORDER_DETAIL.o1;
  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", background: PAGE }}>
      <StatusBar />
      <NavBar title="订单明细" onBack={onBack} />
      <div style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: 16 }}>
        <div style={{ background: PAPER, borderRadius: 12, padding: 16 }}>
          <div style={{ fontSize: 16, fontWeight: 600 }}>{d.item}</div>
          <div style={{ marginTop: 6, display: "flex", alignItems: "baseline", gap: 6 }}>
            <span style={{ fontSize: 22, fontWeight: 700, color: ORANGE }}>¥{d.price}</span>
            <span style={{ padding: "2px 8px", borderRadius: 4, background: CHIP, color: ORANGE, fontSize: 12 }}>{d.tag}</span>
          </div>
        </div>
        <div style={{ marginTop: 10, background: PAPER, borderRadius: 12, padding: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: 14, fontWeight: 600 }}>服务备注</span>
            <span style={{ padding: "2px 8px", borderRadius: 4, background: CHIP, color: ORANGE, fontSize: 12 }}>{d.tag}</span>
          </div>
          <div style={{ marginTop: 10, fontSize: 13, lineHeight: "20px", color: INK }}>{d.note}</div>
          <div style={{ marginTop: 6, fontSize: 12, color: MUTED }}>{d.noteMeta}</div>
        </div>
        <div style={{ marginTop: 10, background: PAPER, borderRadius: 12, padding: 16 }}>
          <div style={{ fontSize: 14, fontWeight: 600 }}>生命周期</div>
          {d.life.map(([k, v]) => (
            <div key={k} style={{ display: "flex", justifyContent: "space-between", marginTop: 12 }}>
              <span style={{ fontSize: 13, color: MUTED }}>{k}</span>
              <span style={{ fontSize: 14, color: INK }}>{v}</span>
            </div>
          ))}
        </div>
        <div style={{ marginTop: 10, background: PAPER, borderRadius: 12, padding: 16 }}>
          <div style={{ fontSize: 14, fontWeight: 600 }}>订单信息</div>
          <div style={{ marginTop: 12, display: "flex", alignItems: "center" }}>
            <div style={{ width: 36, height: 36, borderRadius: 18, background: CHIP, color: ORANGE, fontSize: 14, fontWeight: 600, display: "flex", alignItems: "center", justifyContent: "center" }}>顾</div>
            <div style={{ marginLeft: 10 }}>
              <div style={{ fontSize: 15, fontWeight: 600 }}>{d.customerFull}</div>
              <div style={{ marginTop: 2, fontSize: 12, color: MUTED }}>券号 {d.coupon}</div>
            </div>
          </div>
          {d.fields.map(([k, v]) => (
            <div key={k} style={{ display: "flex", justifyContent: "space-between", marginTop: 12, paddingTop: 10, borderTop: `1px solid ${LINE}` }}>
              <span style={{ fontSize: 12, color: MUTED }}>{k}</span>
              <span style={{ fontSize: 13, color: INK }}>{v}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [stack, setStack] = useState([{ name: "stats" }]);
  const top = stack[stack.length - 1];
  const push = (frame) => setStack((s) => [...s, frame]);
  const pop = () => setStack((s) => (s.length > 1 ? s.slice(0, -1) : s));

  if (top.name === "stats") {
    return <StatsScreen onOpenLogs={({ side, metric }) => push({ name: "logs", side, metric })} />;
  }
  if (top.name === "logs") {
    return (
      <LogsScreen
        side={top.side}
        metric={top.metric}
        onBack={pop}
        onOpenDay={(ctx) => push({ name: "day", ...ctx })}
      />
    );
  }
  if (top.name === "day") {
    return (
      <DayDetailScreen
        date={top.date}
        shop={top.shop}
        clerk={top.clerk}
        onBack={pop}
        onOpenOrder={(orderId) => push({ name: "order", orderId })}
      />
    );
  }
  if (top.name === "order") {
    return <OrderDetailScreen orderId={top.orderId} onBack={pop} />;
  }
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
