function unitOf(metric) {
  if (metric === "亮码" || metric === "扫码") return "次";
  return "人";
}
function showAmount(metric) {
  return metric === "领取" || metric === "被核销";
}

function ChevronDown({ size = 12, color = MUTED, rotate = 0 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 12 12" fill="none" aria-hidden="true"
      style={{ display: "block", flexShrink: 0, transform: rotate ? `rotate(${rotate}deg)` : undefined, transition: "transform .15s" }}>
      <path d="M3 4.5L6 7.5L9 4.5" stroke={color} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}
function ChevronLeft({ size = 22, color = INK }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M15 18l-6-6 6-6" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}
function HelpIcon({ size = 16 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" aria-hidden="true">

      <path d="M9.6 9.4a2.4 2.4 0 1 1 3.5 2.14c-.7.4-1.1.8-1.1 1.66V14" stroke={MUTED} strokeWidth="1.6" strokeLinecap="round" />
      <circle cx="12" cy="17" r="1" fill={MUTED} />
    </svg>
  );
}

/** 人数 / 金额固定栏，避免贴太近 */
function MetricPair({ count, unit, amount, showAmt, size = 14, countColor = INK }) {
  return (
    <span style={{ display: "inline-flex", alignItems: "center", flexShrink: 0 }}>
      <span style={{ minWidth: 52, textAlign: "right", fontSize: size, fontWeight: 700, color: countColor, fontVariantNumeric: "tabular-nums" }}>
        {count}{unit}
      </span>
      {showAmt ? (
        <span style={{ minWidth: 72, marginLeft: 12, textAlign: "right", fontSize: size, fontWeight: 700, color: INK, fontVariantNumeric: "tabular-nums" }}>
          ¥{amount}
        </span>
      ) : null}
    </span>
  );
}

}

        ) : <div style={{ width: 44 }} />}

  );
}

        color: isMgr ? "#fff" : ORANGE,
        borderRadius: 16, height: 30, padding: "0 10px",
        fontSize: 12, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap",
        display: "inline-flex", alignItems: "center", gap: 4, flexShrink: 0,
      }}>
      {isMgr ? "联盟对账" : "店长模式"}
      <ChevronDown size={10} color={isMgr ? "#fff" : ORANGE} rotate={-90} />
    </button>
  );
}

function Sheet({ title, options, value, onPick, onClose }) {
  return (
    <>
      <div onClick={onClose} style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,.45)", zIndex: 40 }} />
      <div style={{ position: "absolute", left: 0, right: 0, bottom: 0, zIndex: 41, background: PAPER, borderTopLeftRadius: 12, borderTopRightRadius: 12, padding: "16px 16px 28px", maxHeight: "55%", overflow: "auto" }}>
        <div style={{ fontSize: 16, fontWeight: 600, textAlign: "center" }}>{title}</div>
        <div style={{ marginTop: 8 }}>
          {options.map((opt) => {
            const on = opt === value;
            return (
              <button key={opt} type="button" onClick={() => onPick(opt)}
                style={{ appearance: "none", border: "none", borderTop: `1px solid ${LINE}`, background: "transparent", width: "100%", height: 48, display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 4px", fontSize: 15, color: on ? ORANGE : INK, fontWeight: on ? 600 : 400, cursor: "pointer" }}>
                <span>{opt}</span>
                {on ? <span style={{ fontSize: 13, color: ORANGE }}>已选</span> : null}
              </button>
            );
          })}
        </div>
      </div>
    </>
  );
}

function FilterChip({ label, active, onClick }) {
  return (
    <button type="button" onClick={onClick}
      style={{ appearance: "none", border: `1px solid ${active ? ORANGE : "#DDD"}`, background: active ? CHIP : PAPER, color: active ? ORANGE : "#666", borderRadius: 16, height: 30, padding: "0 12px", fontSize: 12, display: "inline-flex", alignItems: "center", gap: 4, flexShrink: 0, cursor: "pointer" }}>
      <span>{label}</span>
      <ChevronDown size={10} color={active ? ORANGE : MUTED} />
    </button>
  );
}

function TabBar({ active }) {
  const items = ["联盟", "扫码核销", "数据统计"];
  return (
    <div style={{ flexShrink: 0, height: 52, background: PAPER, borderTop: `1px solid ${LINE}`, display: "flex" }}>
      {items.map((item) => (
        <div key={item} style={{ flex: 1, textAlign: "center", paddingTop: 10, fontSize: 11, fontWeight: 600, color: item === active ? ORANGE : "#999" }}>{item}</div>
      ))}
    </div>
  );
}

          <span style={{ fontSize: 13, color: INK }}>{label}</span>

function LogsScreen({ side, metric: initMetric, onBack, onOpenDay }) {
  const [tab, setTab] = useState("每日");
  const [metric, setMetric] = useState(initMetric || "被核销");
  const [timeRange, setTimeRange] = useState("近7天");
  const [store, setStore] = useState("全部门店");
  const [storeDate, setStoreDate] = useState("全部");
  const [sheet, setSheet] = useState(null);
  const [openDay, setOpenDay] = useState("11月03日");
  const [openStoreL2, setOpenStoreL2] = useState({ "11月03日|凯德晶萃店": true });
  const [openShop, setOpenShop] = useState("凯德晶萃店");

  const brand = side === "发来" ? "GANO HAIR" : "丽妍雅集";
  const unit = unitOf(metric);
  const withAmt = showAmount(metric);
  const clickableL3 = metric === "被核销";

  const days = useMemo(() => {
    let list = DAY_DATA[metric] || [];
    if (store !== "全部门店") {
      list = list.map((d) => ({ ...d, stores: d.stores.filter((s) => s.name === store) })).filter((d) => d.stores.length);
    }
    return list;
  }, [metric, store]);

  const shops = STORE_DATA[metric] || [];
  const closeSheet = () => setSheet(null);
  const toggleL2 = (key) => setOpenStoreL2((prev) => ({ ...prev, [key]: !prev[key] }));

  const renderPhones = (phones, ctx) =>
    phones.map(([phone, n]) => (
      <button key={phone + n} type="button"
        onClick={() => { if (clickableL3) onOpenDay({ date: ctx.date, shop: ctx.shop, clerk: phone }); }}
        style={{ appearance: "none", border: "none", background: "transparent", width: "100%", display: "flex", alignItems: "center", padding: "10px 16px 10px 32px", cursor: clickableL3 ? "pointer" : "default", textAlign: "left" }}>
        <span style={{ flex: 1, fontSize: 13, color: "#666" }}>{phone}</span>
        <span style={{ fontSize: 13, color: INK, marginRight: clickableL3 ? 8 : 0, fontVariantNumeric: "tabular-nums" }}>{n}次</span>
        {clickableL3 ? <ChevronDown size={12} color="#CCC" rotate={-90} /> : null}
      </button>
    ));

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", background: PAGE, position: "relative" }}>
      <StatusBar />
      <NavBar title="数据明细" subtitle={brand} onBack={onBack} />
      <div style={{ display: "flex", justifyContent: "center", gap: 28, background: PAPER, borderBottom: `1px solid ${LINE}` }}>
        {["每日", "按门店"].map((name) => {
          const on = tab === name;
          return (
            <button key={name} type="button" onClick={() => setTab(name)}
              style={{ appearance: "none", border: "none", background: "transparent", padding: "10px 0 8px", fontSize: 14, fontWeight: on ? 600 : 400, color: on ? ORANGE : MUTED, borderBottom: on ? `2px solid ${ORANGE}` : "2px solid transparent", cursor: "pointer" }}>
              {name}
            </button>
          );
        })}
      </div>
      <div style={{ display: "flex", gap: 8, padding: "10px 16px", overflowX: "auto", flexShrink: 0 }}>
        {tab === "每日" ? (
          <>
            <FilterChip label={timeRange} active onClick={() => setSheet("time")} />
            <FilterChip label={metric} active onClick={() => setSheet("metric")} />
            <FilterChip label={store} onClick={() => setSheet("store")} />
          </>
        ) : (
          <>
            <FilterChip label={storeDate === "全部" ? "全部日期" : storeDate} active onClick={() => setSheet("date")} />
            <FilterChip label={metric} active onClick={() => setSheet("metric")} />
          </>
        )}
      </div>
      <div style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: "0 12px 16px" }}>
        {tab === "每日" ? (
          days.length === 0 ? <Empty /> : days.map((day) => {
            const dayOpen = openDay === day.date;
            return (
              <div key={day.date} style={{ background: PAPER, borderRadius: 10, marginBottom: 10, overflow: "hidden" }}>
                <button type="button" onClick={() => setOpenDay(dayOpen ? "" : day.date)}
                  style={{ appearance: "none", border: "none", background: "transparent", width: "100%", display: "flex", alignItems: "center", padding: "14px 16px", cursor: "pointer", gap: 8 }}>
                  <span style={{ flex: 1, fontSize: 15, fontWeight: 600, textAlign: "left" }}>{day.date}</span>
                  <MetricPair count={day.total} unit={unit} amount={day.amount} showAmt={withAmt} size={15} countColor={ORANGE} />
                  <ChevronDown rotate={dayOpen ? 180 : 0} />
                </button>
                {dayOpen ? day.stores.map((s) => {
                  const key = day.date + "|" + s.name;
                  const expanded = !!openStoreL2[key];
                  return (
                    <div key={s.name}>
                      <button type="button" onClick={() => toggleL2(key)}
                        style={{ appearance: "none", border: "none", borderTop: `1px solid ${LINE}`, background: "transparent", width: "100%", display: "flex", alignItems: "center", padding: "12px 16px", cursor: "pointer", gap: 8 }}>
                        <span style={{ flex: 1, fontSize: 14, textAlign: "left" }}>{s.name}</span>
                        <MetricPair count={s.count} unit={unit} amount={s.amount} showAmt={withAmt && s.amount != null} size={14} />
                        <ChevronDown rotate={expanded ? 180 : -90} />
                      </button>
                      {expanded ? renderPhones(s.phones, { date: day.date, shop: s.name }) : null}
                    </div>
                  );
                }) : null}
              </div>
            );
          })
        ) : (
          shops.map((card) => {
            const isOpen = openShop === card.shop;
            return (
              <div key={card.shop} style={{ background: PAPER, borderRadius: 10, marginBottom: 10, overflow: "hidden" }}>
                <button type="button" onClick={() => setOpenShop(isOpen ? "" : card.shop)}
                  style={{ appearance: "none", border: "none", background: "transparent", width: "100%", display: "flex", alignItems: "center", padding: "14px 16px", cursor: "pointer", gap: 8 }}>
                  <span style={{ flex: 1, fontSize: 15, fontWeight: 600, textAlign: "left" }}>{card.shop}</span>
                  <MetricPair count={card.count} unit={unit} amount={card.amount} showAmt={withAmt} size={15} countColor={ORANGE} />
                  {/* 按门店 L1：收起↓ / 展开↑（勿用 ›） */}
                  <ChevronDown rotate={isOpen ? 180 : 0} />
                </button>
                {isOpen ? renderPhones(card.phones, { date: storeDate === "全部" ? "11月03日" : storeDate, shop: card.shop }) : null}
              </div>
            );
          })
        )}
        <div style={{ marginTop: 4, fontSize: 11, color: MUTED, lineHeight: "16px", padding: "0 4px" }}>
          L3：亮码=顾问 · 扫码/领取=顾客 · 被核销=核销员（可点 › 进 12）
        </div>
      </div>
      {sheet === "time" ? <Sheet title="选择时间范围" options={TIME_OPTS} value={timeRange} onPick={(v) => { setTimeRange(v); closeSheet(); }} onClose={closeSheet} /> : null}
      {sheet === "metric" ? <Sheet title="选择漏斗态" options={METRICS} value={metric} onPick={(v) => { setMetric(v); closeSheet(); }} onClose={closeSheet} /> : null}
      {sheet === "store" ? <Sheet title="选择门店" options={STORE_OPTS} value={store} onPick={(v) => { setStore(v); closeSheet(); }} onClose={closeSheet} /> : null}
      {sheet === "date" ? <Sheet title="选择日期" options={DATE_OPTS} value={storeDate} onPick={(v) => { setStoreDate(v); closeSheet(); }} onClose={closeSheet} /> : null}
    </div>
  );
}

        <FilterChip label={metric} active onClick={() => setSheet("metric")} />
      </div>
      <div style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: "0 12px 16px" }}>
        {tab === "按日" ? days.map((day) => {
          const open = openKey === day.date;
          return (
            <div key={day.date} style={{ background: PAPER, borderRadius: 10, marginBottom: 10, overflow: "hidden" }}>
              <button type="button" onClick={() => setOpenKey(open ? "" : day.date)}
                style={{ appearance: "none", border: "none", background: "transparent", width: "100%", display: "flex", alignItems: "center", padding: "14px 16px", cursor: "pointer", gap: 8 }}>
                <span style={{ flex: 1, fontSize: 15, fontWeight: 600, textAlign: "left" }}>{day.date}</span>
                <MetricPair count={day.total} unit={unit} amount={day.amount} showAmt={withAmt} size={15} countColor={ORANGE} />
                <ChevronDown rotate={open ? 180 : 0} />
              </button>
              {open ? day.staff.map(([phone, n]) => (
                <button key={phone} type="button"
                  onClick={() => {
                    if (clickable) onOpenDay({ date: day.date, shop: MY_STORE, clerk: phone });
                    else onOpenStaff(phone);
                  }}
                  style={{ appearance: "none", border: "none", borderTop: `1px solid ${LINE}`, background: "transparent", width: "100%", display: "flex", alignItems: "center", padding: "12px 16px 12px 28px", cursor: "pointer", textAlign: "left" }}>
                  <span style={{ flex: 1, fontSize: 13, color: "#666" }}>{phone}</span>
                  <span style={{ fontSize: 13, marginRight: 8 }}>{n}{unit === "次" ? "次" : "次"}</span>
                  <ChevronDown size={12} color="#CCC" rotate={-90} />
                </button>
              )) : null}
            </div>
          );
        }) : staffs.map((s) => {
          const open = openKey === s.phone;
          return (
            <div key={s.phone} style={{ background: PAPER, borderRadius: 10, marginBottom: 10, overflow: "hidden" }}>
              <button type="button" onClick={() => setOpenKey(open ? "" : s.phone)}
                style={{ appearance: "none", border: "none", background: "transparent", width: "100%", display: "flex", alignItems: "center", padding: "14px 16px", cursor: "pointer", gap: 8 }}>
                <span style={{ flex: 1, fontSize: 15, fontWeight: 600, textAlign: "left" }}>{s.phone}</span>
                <MetricPair count={s.count} unit={unit} amount={s.amount} showAmt={withAmt} size={15} countColor={ORANGE} />
                <ChevronDown rotate={open ? 180 : 0} />
              </button>
              {open ? (
                <>
                  {s.days.map(([d, n]) => (
                    <button key={d} type="button"
                      onClick={() => {
                        if (clickable) onOpenDay({ date: d, shop: MY_STORE, clerk: s.phone });
                      }}
                      style={{ appearance: "none", border: "none", borderTop: `1px solid ${LINE}`, background: "transparent", width: "100%", display: "flex", alignItems: "center", padding: "12px 16px 12px 28px", cursor: clickable ? "pointer" : "default", textAlign: "left" }}>
                      <span style={{ flex: 1, fontSize: 13, color: "#666" }}>{d}</span>
                      <span style={{ fontSize: 13, marginRight: clickable ? 8 : 0 }}>{n}次</span>
                      {clickable ? <ChevronDown size={12} color="#CCC" rotate={-90} /> : null}
                    </button>
                  ))}
                  <button type="button" onClick={() => onOpenStaff(s.phone)}
                    style={{ appearance: "none", border: "none", borderTop: `1px solid ${LINE}`, background: CHIP, width: "100%", padding: "12px 16px", fontSize: 13, color: ORANGE, fontWeight: 600, cursor: "pointer" }}>
                    查看员工详情
                  </button>
                </>
              ) : null}
            </div>
          );
        })}
      </div>
      {sheet === "time" ? <Sheet title="选择时间范围" options={TIME_OPTS} value={range} onPick={(v) => { setRange(v); setSheet(null); }} onClose={() => setSheet(null)} /> : null}
      {sheet === "metric" ? <Sheet title="选择漏斗态" options={METRICS} value={metric} onPick={(v) => { setMetric(v); setSheet(null); }} onClose={() => setSheet(null)} /> : null}
    </div>
  );
}

/* —— 22 员工详情 —— */
function ManagerStaff({ phone, onBack, onOpenOrder }) {
  const d = MG_STAFF_DETAIL[phone] || MG_STAFF_DETAIL["138****1024"];
  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", background: PAGE }}>
      <StatusBar />
      <NavBar title="员工详情" subtitle={MY_STORE} onBack={onBack} />
      <div style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: 16 }}>
        <div style={{ background: PAPER, borderRadius: 12, padding: 16 }}>
          <div style={{ fontSize: 18, fontWeight: 600 }}>{phone}</div>
          <div style={{ marginTop: 4, fontSize: 12, color: MUTED }}>{d.role} · 近7天</div>
          <div style={{ marginTop: 12, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            {d.kpi.map(([k, v]) => (
              <div key={k} style={{ background: PAGE, borderRadius: 8, padding: "10px 8px" }}>
                <div style={{ fontSize: 11, color: MUTED }}>{k}</div>
                <div style={{ marginTop: 4, fontSize: 16, fontWeight: 700, color: ORANGE }}>{v}</div>
              </div>
            ))}
          </div>
        </div>
        <div style={{ marginTop: 12, background: PAPER, borderRadius: 12, padding: 16 }}>
          <div style={{ fontSize: 14, fontWeight: 600 }}>近3日趋势</div>
          <div style={{ marginTop: 12, display: "flex", alignItems: "flex-end", gap: 16, height: 80 }}>
            {d.trend.map(([lab, n]) => (
              <div key={lab} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end", height: "100%" }}>
                <div style={{ width: "100%", maxWidth: 36, height: `${Math.max(12, n * 22)}px`, background: ORANGE, borderRadius: 4 }} />
                <div style={{ marginTop: 6, fontSize: 11, color: MUTED }}>{lab}</div>
              </div>
            ))}
          </div>
        </div>
        <div style={{ marginTop: 12, background: PAPER, borderRadius: 12, padding: "4px 16px 8px" }}>
          <div style={{ padding: "12px 0 4px", fontSize: 14, fontWeight: 600 }}>操作流水</div>
          {d.logs.map((log, i) => (
            <button key={log.t + i} type="button"
              onClick={() => { if (log.orderId) onOpenOrder(log.orderId); }}
              style={{ appearance: "none", border: "none", borderTop: `1px solid ${LINE}`, background: "transparent", width: "100%", padding: "12px 0", display: "flex", alignItems: "center", cursor: log.orderId ? "pointer" : "default", textAlign: "left" }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 600 }}>{log.act}</div>
                <div style={{ marginTop: 2, fontSize: 12, color: MUTED }}>{log.t} · {log.note}</div>
              </div>
              {log.orderId ? <ChevronDown size={12} color="#CCC" rotate={-90} /> : null}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

/* —— 23 本店排行 —— */
function ManagerRank({ onBack, onOpenStaff }) {
  const [tab, setTab] = useState("亮码榜");
  const list = tab === "亮码榜" ? MG_RANK_CODE : MG_RANK_REDEEM;
  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", background: PAGE }}>
      <StatusBar />
      <NavBar title="本店排行" subtitle={`${MY_STORE} · 近7天`} onBack={onBack} />
      <div style={{ display: "flex", justifyContent: "center", gap: 28, background: PAPER, borderBottom: `1px solid ${LINE}` }}>
        {["亮码榜", "核销榜"].map((name) => {
          const on = tab === name;
          return (
            <button key={name} type="button" onClick={() => setTab(name)}
              style={{ appearance: "none", border: "none", background: "transparent", padding: "10px 0 8px", fontSize: 14, fontWeight: on ? 600 : 400, color: on ? ORANGE : MUTED, borderBottom: on ? `2px solid ${ORANGE}` : "2px solid transparent", cursor: "pointer" }}>
              {name}
            </button>
          );
        })}
      </div>
      <div style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: 16 }}>
        <div style={{ background: PAPER, borderRadius: 12, overflow: "hidden" }}>
          {list.map((r, i) => (
            <button key={r.phone} type="button" onClick={() => onOpenStaff(r.phone)}
              style={{ appearance: "none", border: "none", borderTop: i ? `1px solid ${LINE}` : "none", background: "transparent", width: "100%", display: "flex", alignItems: "center", padding: "14px 16px", cursor: "pointer", textAlign: "left" }}>
              <span style={{ width: 28, height: 28, borderRadius: 14, background: i < 3 ? CHIP : PAGE, color: ORANGE, fontSize: 13, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{i + 1}</span>
              <div style={{ flex: 1, marginLeft: 10 }}>
                <div style={{ fontSize: 14, fontWeight: 600 }}>{r.phone}</div>
                <div style={{ marginTop: 2, fontSize: 12, color: MUTED }}>{r.extra}</div>
              </div>
              <span style={{ fontSize: 15, fontWeight: 700, color: ORANGE, marginRight: 8 }}>{r.n}{tab === "亮码榜" ? "次" : "人"}</span>
              <ChevronDown size={12} color="#CCC" rotate={-90} />
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [mode, setMode] = useState("alliance"); // alliance | manager
  const [stack, setStack] = useState([{ name: "stats" }]);
  const top = stack[stack.length - 1];
  const push = (frame) => setStack((s) => [...s, frame]);
  const pop = () => setStack((s) => (s.length > 1 ? s.slice(0, -1) : s));

  const toggleMode = () => {
    if (mode === "alliance") {
      setMode("manager");
      setStack([{ name: "mgrHome" }]);
    } else {
      setMode("alliance");
      setStack([{ name: "stats" }]);
    }
  };

  if (top.name === "stats") {
    return <StatsScreen mode={mode} onToggleMode={toggleMode} onOpenLogs={({ side, metric }) => push({ name: "logs", side, metric })} />;
  }
  if (top.name === "logs") {
    return <LogsScreen side={top.side} metric={top.metric} onBack={pop} onOpenDay={(ctx) => push({ name: "day", ...ctx })} />;
  }
  if (top.name === "mgrHome") {
    return (
      <ManagerHome
        mode={mode}
        onToggleMode={toggleMode}
        onOpenDetail={(metric) => push({ name: "mgrDetail", metric })}
        onOpenStaff={(phone) => push({ name: "mgrStaff", phone })}
        onOpenRank={() => push({ name: "mgrRank" })}
      />
    );
  }
  if (top.name === "mgrDetail") {
    return (
      <ManagerDetail
        metric={top.metric}
        onBack={pop}
        onOpenDay={(ctx) => push({ name: "day", ...ctx })}
        onOpenStaff={(phone) => push({ name: "mgrStaff", phone })}
      />
    );
  }
  if (top.name === "mgrStaff") {
    return <ManagerStaff phone={top.phone} onBack={pop} onOpenOrder={(orderId) => push({ name: "order", orderId })} />;
  }
  if (top.name === "mgrRank") {
    return <ManagerRank onBack={pop} onOpenStaff={(phone) => push({ name: "mgrStaff", phone })} />;
  }
  if (top.name === "day") {
    return (
      <DayDetailScreen
        date={top.date} shop={top.shop} clerk={top.clerk}
        onBack={pop}
        onOpenOrder={(orderId) => push({ name: "order", orderId })}
      />
    );
  }
  if (top.name === "order") {
    return <OrderDetailScreen orderId={top.orderId} onBack={pop} />;
  }
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
