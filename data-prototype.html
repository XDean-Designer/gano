function Icon({ name, size = 12, style, color }) {
  const def = ICON_SVG[name];
  if (!def) return null;
  const col = color || def.color;
  return (
    <svg
      width={size}
      height={size}
      viewBox={def.vb}
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      style={{ display: "block", flexShrink: 0, color: col, ...style }}
      aria-hidden="true"
      dangerouslySetInnerHTML={{ __html: def.body }}
    />
  );
}

async function copyMarkdown(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fallback */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

/* —— 10 时间范围（30R）—— */
const RANGE_PRESETS = ["今天", "本周", "上周", "本月", "全部"];
const RANGE_STORAGE_KEY = "alliance-stats-range-v1";
const WEEKDAYS = ["一", "二", "三", "四", "五", "六", "日"];

function pad2(n) {
  return String(n).padStart(2, "0");
}
function ymd(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function parseYmd(s) {
  const [y, m, d] = String(s || "").split("-").map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m - 1, d);
}
function startOfDay(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function addDays(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}
/** 周一为一周起点（Asia/Shanghai 本地日） */
function startOfWeekMon(d) {
  const x = startOfDay(d);
  const dow = (x.getDay() + 6) % 7; // Mon=0
  return addDays(x, -dow);
}
function fmtShort(s) {
  const d = parseYmd(s);
  if (!d) return s || "";
  return `${d.getMonth() + 1}/${d.getDate()}`;
}
function rangeLabel(range) {
  if (!range) return "全部";
  if (range.preset === "custom" && range.start && range.end) {
    return `${fmtShort(range.start)}–${fmtShort(range.end)}`;
  }
  return range.preset || "全部";
}
function defaultRange() {
  return { preset: "全部" };
}
function loadSavedRange() {
  try {
    const raw = localStorage.getItem(RANGE_STORAGE_KEY);
    if (!raw) return defaultRange();
    const j = JSON.parse(raw);
    if (j && RANGE_PRESETS.includes(j.preset)) return { preset: j.preset };
    if (j && j.preset === "custom" && j.start && j.end) {
      const a = parseYmd(j.start);
      const b = parseYmd(j.end);
      if (a && b) {
        const start = a <= b ? j.start : j.end;
        const end = a <= b ? j.end : j.start;
        return { preset: "custom", start, end };
      }
    }
  } catch (e) { /* ignore */ }
  return defaultRange();
}
function saveRange(range) {
  try {
    localStorage.setItem(RANGE_STORAGE_KEY, JSON.stringify(range));
  } catch (e) { /* ignore */ }
}
function rangeScale(range) {
  if (!range) return 1;
  if (range.preset === "今天") return 0.18;
  if (range.preset === "本周") return 0.42;
  if (range.preset === "上周") return 0.36;
  if (range.preset === "本月") return 0.72;
  if (range.preset === "全部") return 1;
  if (range.preset === "custom" && range.start && range.end) {
    const a = parseYmd(range.start);
    const b = parseYmd(range.end);
    if (!a || !b) return 0.5;
    const days = Math.max(1, Math.round((b - a) / 86400000) + 1);
    return Math.min(1, Math.max(0.12, days / 45));
  }
  return 1;
}
function scaleNum(n, s) {
  return Math.max(0, Math.round(n * s));
}

function resolveRangeBounds(range, now = new Date()) {
  const today = startOfDay(now);
  if (!range || range.preset === "全部") return { start: null, end: null };
  if (range.preset === "今天") return { start: ymd(today), end: ymd(today) };
  if (range.preset === "本周") {
    const s = startOfWeekMon(today);
    return { start: ymd(s), end: ymd(addDays(s, 6)) };
  }
  if (range.preset === "上周") {
    const s = addDays(startOfWeekMon(today), -7);
    return { start: ymd(s), end: ymd(addDays(s, 6)) };
  }
  if (range.preset === "本月") {
    const s = new Date(today.getFullYear(), today.getMonth(), 1);
    const e = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    return { start: ymd(s), end: ymd(e) };
  }
  if (range.preset === "custom" && range.start && range.end) {
    return { start: range.start, end: range.end };
  }
  return { start: null, end: null };
}

function fmtDayCn(s) {
  const d = parseYmd(s);
  if (!d) return "";
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}

function MonthGrid({ view, start, end, onPickDay, k = 1 }) {
  const { vs, fs } = sheetMetrics(k);
  const year = view.getFullYear();
  const month = view.getMonth();
  const first = new Date(year, month, 1);
  const lead = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));
  while (cells.length % 7) cells.push(null);

  const startT = start ? startOfDay(parseYmd(start)).getTime() : null;
  const endT = end ? startOfDay(parseYmd(end)).getTime() : null;
  const todayT = startOfDay(new Date()).getTime();
  const sameDay = startT != null && endT != null && startT === endT;

  const cellH = vs(40);
  const dot = vs(36);

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", marginBottom: 2 }}>
        {WEEKDAYS.map((w) => (
          <div key={w} style={{ textAlign: "center", fontSize: fs(12), color: MUTED, height: vs(30), lineHeight: `${vs(30)}px`, fontWeight: 500 }}>{w}</div>
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", rowGap: vs(4) }}>
        {cells.map((day, i) => {
          if (!day) return <div key={`e${i}`} style={{ height: cellH }} />;
          const t = startOfDay(day).getTime();
          const key = ymd(day);
          const isStart = startT != null && t === startT;
          const isEnd = endT != null && t === endT;
          const inMid = startT != null && endT != null && t > startT && t < endT;
          const isToday = t === todayT;
          const isEdge = isStart || isEnd;

          let cellBg = "transparent";
          if (inMid) cellBg = "rgba(255,96,2,0.12)";
          if (isStart && endT != null && !sameDay) cellBg = "linear-gradient(90deg, transparent 50%, rgba(255,96,2,0.12) 50%)";
          if (isEnd && startT != null && !sameDay) cellBg = "linear-gradient(90deg, rgba(255,96,2,0.12) 50%, transparent 50%)";
          if (sameDay && isStart) cellBg = "transparent";

          return (
            <button key={key} type="button" onClick={() => onPickDay(key)}
              style={{
                appearance: "none", border: "none", background: cellBg, padding: 0,
                height: cellH, cursor: "pointer", position: "relative",
                display: "flex", alignItems: "center", justifyContent: "center",
              }}>
              <span style={{
                width: dot, height: dot, borderRadius: dot / 2,
                display: "inline-flex", alignItems: "center", justifyContent: "center",
                background: isEdge ? ORANGE : "transparent",
                color: isEdge ? "#fff" : INK,
                fontWeight: isEdge || isToday ? 700 : 500,
                fontSize: fs(15),
                border: !isEdge && isToday ? `1.5px solid ${ORANGE}` : "1.5px solid transparent",
                boxSizing: "border-box",
              }}>
                {day.getDate()}
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* 手机可视高度：真机取 --mobile-h（已换算为逻辑高度），桌面预览固定 844 */
function usePhoneHeight() {
  const read = () => {
    const root = document.documentElement;
    if (root.classList.contains("is-mobile")) {
      const v = parseFloat(getComputedStyle(root).getPropertyValue("--mobile-h"));
      if (isFinite(v) && v > 0) return v;
      return window.innerHeight || 844;
    }
    return 844;
  };
  const [h, setH] = useState(read);
  useEffect(() => {
    const on = () => setH(read());
    window.addEventListener("resize", on);
    const vv = window.visualViewport;
    if (vv) {
      vv.addEventListener("resize", on);
      vv.addEventListener("scroll", on);
    }
    return () => {
      window.removeEventListener("resize", on);
      if (vv) {
        vv.removeEventListener("resize", on);
        vv.removeEventListener("scroll", on);
      }
    };
  }, []);
  return h;
}

/* 按压高等比缩放的垂直尺寸 / 字号（字号收缩更保守，避免糊成一片） */
function sheetMetrics(k) {
  const vs = (n) => Math.max(1, Math.round(n * k));
  const fs = (n) => Math.round(n * (0.88 + 0.12 * k) * 10) / 10;
  return { vs, fs };
}

/* Sheet 基准内容高 ≈ 651px（390 宽、k=1）；留 8% 余量按可视高缩放，使其恰好放满且不出现内滚动 */
const SHEET_BASE_H = 664;
const SHEET_MAX_RATIO = 0.92;

function RangeSheet({ value, onApply, onClose, viewportH }) {
  const avail = Math.max(320, Math.round(viewportH * SHEET_MAX_RATIO));
  const k = Math.min(1, Math.max(0.62, (avail - 6) / SHEET_BASE_H));
  const { vs, fs } = sheetMetrics(k);
  const initialBounds = resolveRangeBounds(value);
  const [activePreset, setActivePreset] = useState(value.preset === "custom" ? null : value.preset);
  const [draftStart, setDraftStart] = useState(initialBounds.start || "");
  const [draftEnd, setDraftEnd] = useState(initialBounds.end || "");
  const [view, setView] = useState(() => {
    const base = initialBounds.start ? parseYmd(initialBounds.start) : new Date();
    return new Date(base.getFullYear(), base.getMonth(), 1);
  });

  const canConfirm = !!draftStart && !!draftEnd;
  const dirtyCustom = activePreset == null;

  const pickPreset = (p) => {
    onApply({ preset: p });
    onClose();
  };

  const pickDay = (key) => {
    setActivePreset(null);
    if (!draftStart || (draftStart && draftEnd)) {
      setDraftStart(key);
      setDraftEnd("");
      return;
    }
    const a = parseYmd(draftStart);
    const b = parseYmd(key);
    if (!a || !b) return;
    if (b < a) {
      setDraftStart(key);
      setDraftEnd("");
      return;
    }
    setDraftEnd(key);
  };

  const confirmCustom = () => {
    if (!canConfirm) return;
    onApply({ preset: "custom", start: draftStart, end: draftEnd });
    onClose();
  };

  const row1 = ["今天", "本周", "上周"];
  const row2 = ["本月", "全部"];

  const chipH = vs(36);
  const navSz = vs(36);
  const boxH = vs(48);
  const btnH = vs(48);

  const chip = (opt) => {
    const on = activePreset === opt;
    return (
      <button key={opt} type="button" onClick={() => pickPreset(opt)}
        style={{
          appearance: "none",
          border: on ? `1.5px solid ${ORANGE}` : `1px solid ${LINE}`,
          background: on ? ORANGE : PAPER,
          color: on ? "#fff" : INK,
          borderRadius: chipH / 2, height: chipH, padding: `0 ${vs(14)}px`,
          fontSize: fs(14), fontWeight: on ? 650 : 500, cursor: "pointer",
          flex: "1 1 0",
          minWidth: 0,
        }}>
        {opt}
      </button>
    );
  };

  return (
    <>
      <div onClick={onClose} style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,.45)", zIndex: 40 }} />
      <div className="proto-sheet" style={{
        position: "absolute", left: 0, right: 0, bottom: 0, zIndex: 41, background: PAPER,
        borderTopLeftRadius: 16, borderTopRightRadius: 16,
        padding: `${vs(10)}px 16px ${vs(18)}px`, maxHeight: avail, overflow: "hidden",
      }}>
        <div style={{ width: 36, height: 4, borderRadius: 2, background: "#E5E5E5", margin: `0 auto ${vs(10)}px` }} />
        <div style={{ fontSize: fs(17), fontWeight: 700, textAlign: "center", color: INK, letterSpacing: "0.02em" }}>选择时间范围</div>

        <div style={{ marginTop: vs(14), display: "flex", gap: 8 }}>{row1.map(chip)}</div>
        <div style={{ marginTop: vs(8), display: "flex", gap: 8 }}>
          {row2.map(chip)}
          <div style={{ flex: "1 1 0" }} />
        </div>

        <div style={{
          marginTop: vs(16), paddingTop: vs(14), borderTop: `1px solid ${LINE}`,
        }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: vs(10) }}>
            <button type="button" onClick={() => setView(new Date(view.getFullYear(), view.getMonth() - 1, 1))}
              style={{ appearance: "none", border: `1px solid ${LINE}`, background: PAGE, width: navSz, height: navSz, borderRadius: navSz / 2, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Icon name="chevron-left.svg" size={vs(18)} />
            </button>
            <div style={{ fontSize: fs(16), fontWeight: 700, color: INK }}>{view.getFullYear()}年{view.getMonth() + 1}月</div>
            <button type="button" onClick={() => setView(new Date(view.getFullYear(), view.getMonth() + 1, 1))}
              style={{ appearance: "none", border: `1px solid ${LINE}`, background: PAGE, width: navSz, height: navSz, borderRadius: navSz / 2, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Icon name="chevron-right.svg" size={vs(18)} />
            </button>
          </div>
          <MonthGrid
            view={view}
            start={draftStart || null}
            end={draftEnd || null}
            onPickDay={pickDay}
            k={k}
          />
        </div>

        <div style={{ marginTop: vs(14), display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{
            flex: 1, minWidth: 0, height: boxH, borderRadius: 10, padding: `0 ${vs(12)}px`,
            background: PAGE, border: `1px solid ${LINE}`,
            display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8,
          }}>
            <span style={{
              flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
              fontSize: fs(14), fontWeight: draftStart ? 600 : 400,
              color: draftStart ? INK : MUTED,
            }}>
              {draftStart ? fmtDayCn(draftStart) : "点击日历选择"}
            </span>
            <span style={{ flexShrink: 0, fontSize: fs(13), fontWeight: 600, color: draftStart ? ORANGE : MUTED }}>起</span>
          </div>
          <div style={{ width: 20, height: 1, background: LINE, flexShrink: 0 }} />
          <div style={{
            flex: 1, minWidth: 0, height: boxH, borderRadius: 10, padding: `0 ${vs(12)}px`,
            background: PAGE, border: `1px solid ${LINE}`,
            display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8,
          }}>
            <span style={{
              flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
              fontSize: fs(14), fontWeight: draftEnd ? 600 : 400,
              color: draftEnd ? INK : MUTED,
            }}>
              {draftEnd ? fmtDayCn(draftEnd) : "点击日历选择"}
            </span>
            <span style={{ flexShrink: 0, fontSize: fs(13), fontWeight: 600, color: draftEnd ? ORANGE : MUTED }}>止</span>
          </div>
        </div>

        <button type="button" disabled={!dirtyCustom || !canConfirm} onClick={confirmCustom}
          style={{
            appearance: "none", border: "none", marginTop: vs(12), width: "100%", height: btnH, borderRadius: btnH / 2,
            background: dirtyCustom && canConfirm ? ORANGE : "#F0F0F0",
            color: dirtyCustom && canConfirm ? "#fff" : MUTED,
            fontSize: fs(16), fontWeight: 700, cursor: dirtyCustom && canConfirm ? "pointer" : "default",
          }}>
          完成
        </button>
      </div>
    </>
  );
}

/* —— 11 数据明细 —— */
function LogsScreen({ side, metric: initMetric, onBack, onOpenDay }) {
  const [tab, setTab] = useState("每日");
  const [metric, setMetric] = useState(initMetric || "被核销");
  const [timeRange, setTimeRange] = useState("近7天");
  const [store, setStore] = useState("全部门店");
  const [storeDate, setStoreDate] = useState("全部");
  const [sheet, setSheet] = useState(null);
  const [openDay, setOpenDay] = useState("11月03日");
  const [openStoreL2, setOpenStoreL2] = useState({ "11月03日|凯德晶萃店": true });
  const [openShop, setOpenShop] = useState("凯德晶萃店");

  const brand = side === "发来" ? "GANO HAIR" : "丽妍雅集";
  const unit = unitOf(metric);
  const withAmt = showAmount(metric);
  const clickableL3 = metric === "被核销";

  const days = useMemo(() => {
    let list = DAY_DATA[metric] || [];
    if (store !== "全部门店") {
      list = list
        .map((d) => {
          const stores = d.stores.filter((s) => s.name === store);
          if (!stores.length) return null;
          const total = stores.reduce((a, s) => a + s.count, 0);
          const amount = withAmt ? stores.reduce((a, s) => a + (s.amount || 0), 0) : null;
          return { ...d, stores, total, amount };
        })
        .filter(Boolean);
    }
    return list;
  }, [metric, store, withAmt]);

  const shops = useMemo(() => {
    let list = STORE_DATA[metric] || [];
    if (storeDate !== "全部" && metric === "被核销") {
      /* demo: keep list for prototype */
    }
    return list;
  }, [metric, storeDate]);

  const closeSheet = () => setSheet(null);
  const toggleL2 = (key) => setOpenStoreL2((prev) => ({ ...prev, [key]: !prev[key] }));
  const { toast, showCopied } = useCopyToast();

  /* 29C：亮码/扫码/领取/被核销 均按当前 metric 导出 Markdown */
  const buildLogsMarkdown = () => {
    const lines = [];
    lines.push(`# 数据明细 · ${brand}`);
    if (tab === "每日") {
      lines.push(`筛选：${timeRange} · ${metric} · ${store}`);
      lines.push("");
      days.forEach((day) => {
        const amt = withAmt && day.amount != null ? ` · ${fmtAmt(day.amount)}` : "";
        lines.push(`## ${day.date} · ${day.total}${unit}${amt}`);
        day.stores.forEach((s) => {
          const sa = withAmt && s.amount != null ? ` · ${fmtAmt(s.amount)}` : "";
          lines.push(`- ${s.name} · ${s.count}${unit}${sa}`);
          (s.phones || []).forEach(([phone, n]) => {
            lines.push(`  - ${phone} · ${n}次`);
          });
        });
        lines.push("");
      });
    } else {
      lines.push(`筛选：${storeDate === "全部" ? "全部日期" : storeDate} · ${metric}`);
      lines.push("");
      shops.forEach((card) => {
        const amt = withAmt && card.amount != null ? ` · ${fmtAmt(card.amount)}` : "";
        lines.push(`## ${card.shop} · ${card.count}${unit}${amt}`);
        (card.phones || []).forEach(([phone, n]) => {
          lines.push(`- ${phone} · ${n}次`);
        });
        lines.push("");
      });
    }
    return lines.join("\n").trim() + "\n";
  };

  const renderPhones = (phones, ctx) =>
    phones.map(([phone, n]) => (
      <button key={phone + n} type="button"
        onClick={() => { if (clickableL3) onOpenDay({ date: ctx.date, shop: ctx.shop, clerk: phone }); }}
        style={{
          appearance: "none", border: "none", background: "transparent", width: "100%",
          display: "flex", alignItems: "center", justifyContent: "space-between",
          padding: "10px 16px 10px 32px", height: 40,
          cursor: clickableL3 ? "pointer" : "default", textAlign: "left",
        }}>
        <span style={{ fontSize: 13, color: "#666666" }}>{phone}</span>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
          <span style={{ fontSize: 13, color: INK, fontVariantNumeric: "tabular-nums" }}>{n}次</span>
          {clickableL3 ? <Icon name="chevron-right.svg" size={12} /> : null}
        </span>
      </button>
    ));

  const dayHeader = (day, dayOpen) => (
    <button type="button" onClick={() => setOpenDay(dayOpen ? "" : day.date)}
      style={{ appearance: "none", border: "none", background: "transparent", width: "100%", display: "flex", alignItems: "flex-end", padding: "14px 16px", cursor: "pointer" }}>
      <span style={{ flex: 1, minWidth: 0, fontSize: 15, fontWeight: 600, color: INK, lineHeight: "22px", textAlign: "left" }}>{day.date}</span>
      <span style={{ width: 72, textAlign: "right", fontSize: 15, fontWeight: 700, color: ORANGE, lineHeight: "22px", fontVariantNumeric: "tabular-nums" }}>
        {day.total}{unit}
      </span>
      {withAmt ? (
        <span style={{ width: 88, textAlign: "right", fontSize: 15, fontWeight: 700, color: INK, lineHeight: "22px", fontVariantNumeric: "tabular-nums" }}>
          {fmtAmt(day.amount)}
        </span>
      ) : null}
      <span style={{ width: 20, paddingLeft: 8, display: "flex", alignItems: "center", height: 22 }}>
        <Icon name={dayOpen ? "chevron-up.svg" : "chevron-down.svg"} size={12} />
      </span>
    </button>
  );

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", background: PAGE, position: "relative" }}>
      <StatusBar />
      <TitleBar title="数据明细" subtitle={brand} onBack={onBack} onCopy={() => showCopied(buildLogsMarkdown())} />
      <div style={{ display: "flex", justifyContent: "center", gap: 24, background: PAPER, borderBottom: `1px solid ${LINE}`, flexShrink: 0 }}>
        {["每日", "按门店"].map((name) => {
          const on = tab === name;
          return (
            <button key={name} type="button" onClick={() => setTab(name)}
              style={{ appearance: "none", border: "none", background: "transparent", padding: "10px 0 12px", fontSize: 15, fontWeight: on ? 600 : 400, color: on ? ORANGE : MUTED, borderBottom: on ? `2px solid ${ORANGE}` : "2px solid transparent", cursor: "pointer" }}>
              {name}
            </button>
          );
        })}
      </div>
      <div style={{ display: "flex", gap: 8, padding: "10px 16px", overflowX: "auto", flexShrink: 0, height: 50, background: PAGE }}>
        {tab === "每日" ? (
          <>
            <FilterChip label={timeRange} onClick={() => setSheet("time")} />
            <FilterChip label={metric} active onClick={() => setSheet("metric")} />
            <FilterChip label={store} onClick={() => setSheet("store")} />
          </>
        ) : (
          <>
            <FilterChip label={storeDate === "全部" ? "全部日期" : storeDate} onClick={() => setSheet("date")} />
            <FilterChip label={metric} active onClick={() => setSheet("metric")} />
          </>
        )}
      </div>
      <div style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: "0 16px 16px" }}>
        {tab === "每日" ? (
          days.length === 0 ? <Empty /> : days.map((day, di) => {
            const dayOpen = openDay === day.date;
            return (
              <div key={day.date} style={{ marginTop: di ? 10 : 0 }}>
                <Card>
                  {dayHeader(day, dayOpen)}
                  {dayOpen ? (
                    <>
                      <div style={{ padding: "0 16px" }}><div style={{ height: 0.5, background: LINE }} /></div>
                      {day.stores.map((s) => {
                        const key = day.date + "|" + s.name;
                        const expanded = !!openStoreL2[key];
                        return (
                          <div key={s.name}>
                            <button type="button" onClick={() => toggleL2(key)}
                              style={{ appearance: "none", border: "none", background: "transparent", width: "100%", height: 44, display: "flex", alignItems: "center", padding: "12px 12px 12px 16px", cursor: "pointer" }}>
                              <span style={{ flex: 1, fontSize: 14, color: "#212121", textAlign: "left" }}>{s.name}</span>
                              <span style={{ minWidth: 40, textAlign: "right", fontSize: 14, color: "#212121", fontVariantNumeric: "tabular-nums" }}>{s.count}{unit}</span>
                              {withAmt && s.amount != null ? (
                                <span style={{ minWidth: 56, marginLeft: 8, textAlign: "right", fontSize: 14, color: "#212121", fontVariantNumeric: "tabular-nums" }}>{fmtAmt(s.amount)}</span>
                              ) : null}
                              <span style={{ width: 20, marginLeft: 8, display: "flex", justifyContent: "flex-end" }}>
                                <Icon name={expanded ? "chevron-up.svg" : "chevron-right.svg"} size={12} />
                              </span>
                            </button>
                            {expanded ? renderPhones(s.phones, { date: day.date, shop: s.name }) : null}
                          </div>
                        );
                      })}
                    </>
                  ) : null}
                </Card>
              </div>
            );
          })
        ) : (
          shops.length === 0 ? <Empty /> : shops.map((card, i) => {
            const isOpen = openShop === card.shop;
            return (
              <div key={card.shop} style={{ marginTop: i ? 10 : 0 }}>
                <Card>
                  <button type="button" onClick={() => setOpenShop(isOpen ? "" : card.shop)}
                    style={{ appearance: "none", border: "none", background: "transparent", width: "100%", display: "flex", alignItems: "flex-end", padding: "14px 16px", cursor: "pointer" }}>
                    <span style={{ flex: 1, fontSize: 15, fontWeight: 600, color: INK, lineHeight: "22px", textAlign: "left" }}>{card.shop}</span>
                    <span style={{ width: 72, textAlign: "right", fontSize: 15, fontWeight: 700, color: ORANGE, lineHeight: "22px" }}>{card.count}{unit}</span>
                    {withAmt ? (
                      <span style={{ width: 88, textAlign: "right", fontSize: 15, fontWeight: 700, color: INK, lineHeight: "22px" }}>{fmtAmt(card.amount)}</span>
                    ) : null}
                    <span style={{ width: 20, paddingLeft: 8, display: "flex", alignItems: "center", height: 22 }}>
                      <Icon name={isOpen ? "chevron-up.svg" : "chevron-down.svg"} size={12} />
                    </span>
                  </button>
                  {isOpen ? renderPhones(card.phones, { date: storeDate === "全部" ? "11月03日" : storeDate, shop: card.shop }) : null}
                </Card>
              </div>
            );
          })
        )}
      </div>
      {sheet === "time" ? <Sheet title="选择时间范围" options={TIME_OPTS} value={timeRange} onPick={(v) => { setTimeRange(v); closeSheet(); }} onClose={closeSheet} /> : null}
      {sheet === "metric" ? <Sheet title="选择漏斗态" options={METRICS} value={metric} onPick={(v) => { setMetric(v); closeSheet(); }} onClose={closeSheet} /> : null}
      {sheet === "store" ? <Sheet title="选择门店" options={STORE_OPTS} value={store} onPick={(v) => { setStore(v); closeSheet(); }} onClose={closeSheet} /> : null}
      {sheet === "date" ? <Sheet title="选择日期" options={DATE_OPTS} value={storeDate} onPick={(v) => { setStoreDate(v); closeSheet(); }} onClose={closeSheet} /> : null}
      <Toast message={toast} />
    </div>
  );
}

          {d.life.map(([k, v]) => (
            <div key={k} style={{ display: "flex", justifyContent: "space-between", marginTop: 14 }}>
              <span style={{ fontSize: 13, color: MUTED }}>{k}</span>
              <span style={{ fontSize: 14, color: INK }}>{v}</span>
            </div>
          ))}
        </Card>

        <Card style={{ marginTop: 10, padding: "20px 16px 16px" }}>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
            <img src={`${ASSET}/avatar.png`} width={48} height={48} alt="" style={{ borderRadius: 24, objectFit: "cover" }} />
            <div style={{ marginTop: 10, fontSize: 17, fontWeight: 600, color: INK }}>{d.customerFull}</div>
            <div style={{ marginTop: 4, fontSize: 12, color: MUTED }}>券号 {d.coupon}</div>
          </div>
          {d.fields.map(([k, v], i) => (
            <div key={k} style={{ display: "flex", justifyContent: "space-between", marginTop: i === 0 ? 18 : 0, paddingTop: 12, borderTop: `1px solid ${LINE}` }}>
              <span style={{ fontSize: 12, color: MUTED }}>{k}</span>
              <span style={{ fontSize: 13, color: INK }}>{v}</span>
            </div>
          ))}
        </Card>
      </div>
    </div>
  );
}

function App() {
  const [stack, setStack] = useState([{ name: "stats" }]);
  const top = stack[stack.length - 1];
  const push = (frame) => setStack((s) => [...s, frame]);
  const pop = () => setStack((s) => (s.length > 1 ? s.slice(0, -1) : s));

  if (top.name === "stats") {
    return <StatsScreen onOpenLogs={({ side, metric }) => push({ name: "logs", side, metric })} />;
  }
  if (top.name === "logs") {
    return <LogsScreen side={top.side} metric={top.metric} onBack={pop} onOpenDay={(ctx) => push({ name: "day", ...ctx })} />;
  }
  if (top.name === "day") {
    return (
      <DayDetailScreen
        date={top.date} shop={top.shop} clerk={top.clerk}
        onBack={pop}
        onOpenOrder={(orderId) => push({ name: "order", orderId })}
      />
    );
  }
  if (top.name === "order") {
    return <OrderDetailScreen orderId={top.orderId} onBack={pop} />;
  }
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
/* run-on-phone — adapted for .page + #root.phone */
(function () {
  var CONFIG = {
    logicalWidth: 390,
    logicalHeightFallback: 844,
    minLogicalHeight: 500,
    frameSelector: "#root",
    stageSelector: ".page",
    navSelector: "#siteNav",
    scrimSelector: "#siteNavScrim",
    edge: 24,
    openDx: 56,
    closeDx: -48,
    kbJitterPx: 80
  };

  var root = document.documentElement;
  var nav = document.querySelector(CONFIG.navSelector);
  var scrim = document.querySelector(CONFIG.scrimSelector);
  var stage = document.querySelector(CONFIG.stageSelector);

  function queryForce() {
    try {
      var q = new URLSearchParams(location.search).get("mobile");
      if (q === "1" || q === "true") return true;
      if (q === "0" || q === "false") return false;
    } catch (e) {}
    return null;
  }

  function isRealPhone() {
    var ua = navigator.userAgent || "";
    if (/Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua)) {
      if (/Android/i.test(ua) && !/Mobile/i.test(ua)) return false;
      return true;
    }
    if (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) return true;
    return false;
  }

  function shouldMobile() {
    var force = queryForce();
    if (force !== null) return force;
    return isRealPhone();
  }

  function isNavOpen() {
    return root.classList.contains("is-nav-open");
  }

  function openSiteNav() {
    if (!root.classList.contains("is-mobile")) return;
    root.classList.add("is-nav-open");
    if (scrim) scrim.setAttribute("aria-hidden", "false");
  }

  function closeSiteNav() {
    root.classList.remove("is-nav-open");
    if (scrim) scrim.setAttribute("aria-hidden", "true");
  }

  window.openSiteNav = openSiteNav;
  window.closeSiteNav = closeSiteNav;

  function updateScale() {
    if (!root.classList.contains("is-mobile") || !stage) return;
    var w = stage.clientWidth || window.innerWidth;
    var h = stage.clientHeight || window.innerHeight;
    var lw = CONFIG.logicalWidth;
    var lh0 = CONFIG.logicalHeightFallback;
    var scale = w / lw;
    var logicalH = scale > 0 ? h / scale : h;
    if (!isFinite(logicalH) || logicalH < CONFIG.minLogicalHeight) {
      scale = Math.min(w / lw, h / lh0);
      logicalH = lh0;
    }
    if (!isFinite(scale) || scale <= 0) scale = 1;
    root.style.setProperty("--mobile-scale", String(Math.round(scale * 1000) / 1000));
    root.style.setProperty("--mobile-h", Math.round(logicalH) + "px");
  }

  function updateKeyboardInset() {
    if (!root.classList.contains("is-mobile")) return;
    var vv = window.visualViewport;
    if (!vv) {
      root.style.setProperty("--kb-h", "0px");
      return;
    }
    var overlap = window.innerHeight - vv.height - (vv.offsetTop || 0);
    if (!isFinite(overlap) || overlap < 0) overlap = 0;
    var scale = parseFloat(root.style.getPropertyValue("--mobile-scale")) || 1;
    if (!isFinite(scale) || scale <= 0) scale = 1;
    var logical = overlap > CONFIG.kbJitterPx ? overlap / scale : 0;
    root.style.setProperty("--kb-h", Math.round(logical) + "px");
  }

  function applyMode() {
    var on = shouldMobile();
    root.classList.toggle("is-mobile", on);
    if (!on) {
      closeSiteNav();
      root.style.removeProperty("--mobile-scale");
      root.style.removeProperty("--mobile-h");
      root.style.removeProperty("--kb-h");
      return;
    }
    updateScale();
    updateKeyboardInset();
  }

  if (scrim) {
    scrim.addEventListener("click", function () {
      closeSiteNav();
    });
  }

  var track = null;
  function onTouchStart(e) {
    if (!root.classList.contains("is-mobile")) return;
    if (!nav) return;
    if (e.touches.length !== 1) return;
    var t = e.touches[0];
    var open = isNavOpen();
    if (!open && t.clientX > CONFIG.edge) return;
    track = { x0: t.clientX, y0: t.clientY, open: open, locked: false, axis: null };
  }
  function onTouchMove(e) {
    if (!track) return;
    var t = e.touches[0];
    var dx = t.clientX - track.x0;
    var dy = t.clientY - track.y0;
    if (!track.locked) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      track.axis = Math.abs(dx) >= Math.abs(dy) ? "x" : "y";
      track.locked = true;
      if (track.axis === "y") {
        track = null;
        return;
      }
    }
    if (track.axis === "x" && e.cancelable) e.preventDefault();
  }
  function onTouchEnd(e) {
    if (!track) return;
    var t = (e.changedTouches && e.changedTouches[0]) || null;
    var dx = t ? t.clientX - track.x0 : 0;
    var open = track.open;
    var axis = track.axis;
    track = null;
    if (axis !== "x") return;
    if (!open && dx >= CONFIG.openDx) openSiteNav();
    else if (open && dx <= CONFIG.closeDx) closeSiteNav();
  }

  document.addEventListener("touchstart", onTouchStart, { passive: true, capture: true });
  document.addEventListener("touchmove", onTouchMove, { passive: false, capture: true });
  document.addEventListener("touchend", onTouchEnd, { passive: true, capture: true });
  document.addEventListener("touchcancel", function () { track = null; }, { passive: true });

  applyMode();
  window.addEventListener("resize", function () {
    if (root.classList.contains("is-mobile")) {
      updateScale();
      updateKeyboardInset();
    }
  }, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", function () {
      updateScale();
      updateKeyboardInset();
    }, { passive: true });
    window.visualViewport.addEventListener("scroll", updateKeyboardInset, { passive: true });
  }
})();
</script>
</body>
</html>
