<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>剑琅美遇 · 联盟活动数据</title>
<style>
  @font-face{
    font-family:"Noto Sans SC";
    src:url("./fonts/NotoSansSC-VF.ttf") format("truetype");
    font-weight:100 900;
    font-style:normal;
    font-display:swap;
  }
  :root{
    --ink:#1a1a1a;
    --muted:#6b7280;
    --line:#e5e7eb;
    --page:#f3f4f6;
    --card:#ffffff;
    --liyan:#C62828;
    --liyan-soft:#FDECEC;
    --liyan-line:#F5C2C2;
    --gano:#1565C0;
    --gano-soft:#E8F1FB;
    --gano-line:#B6D0F0;
    --warn-bg:#FFF8E7;
    --warn-bd:#E6C35C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:var(--page);
    padding:24px 16px 48px;
  }
  .desk{max-width:1080px;margin:0 auto}
  .sheet{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .brand-bar{
    display:flex;height:4px;
  }
  .brand-bar i{flex:1;display:block}
  .brand-bar .liyan{background:var(--liyan)}
  .brand-bar .gano{background:var(--gano)}
  .topbar{
    display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;
    justify-content:space-between;
    padding:24px 28px 18px;
    border-bottom:1px solid var(--line);
    background:#fff;
  }
  .brand-block h1{
    margin:0;font-size:22px;letter-spacing:.02em;font-weight:700;color:var(--ink);
  }
  .brand-block .sub{
    margin-top:6px;font-size:13px;color:var(--muted);line-height:1.5;
  }
  .legend{
    display:flex;gap:20px;margin-top:14px;flex-wrap:wrap;align-items:center;
  }
  .legend span{
    display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;
  }
  .legend i.swatch{
    width:10px;height:10px;border-radius:2px;display:inline-block;flex-shrink:0;
  }
  .legend .liyan{color:var(--liyan)}
  .legend .liyan i.swatch{background:var(--liyan)}
  .legend .gano{color:var(--gano)}
  .legend .gano i.swatch{background:var(--gano)}
  .logo{
    display:block;object-fit:contain;object-position:left center;
  }
  .logo.liyan{height:22px;width:auto}
  .logo.gano{height:18px;width:auto}
  .logo.lg.liyan{height:32px}
  .logo.lg.gano{height:28px}
  .logo.xl.liyan{height:36px}
  .logo.xl.gano{height:30px}
  .section-head{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    margin:0 0 12px;
  }
  .section-head .eyebrow{
    margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--ink);
  }
  .section-head .hint{font-size:12px;color:var(--muted)}
  .section-head .chip{
    display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;
    background:#111827;color:#fff;font-size:12px;font-weight:600;letter-spacing:.02em;
  }
  .band{
    border-radius:10px;padding:16px 16px 18px;margin-bottom:8px;
  }
  .band-total{
    background:linear-gradient(180deg,#eef2f7 0%,#f8fafc 100%);
    border:1px solid #d8dee8;
  }
  .band-day{
    background:#fff;
    border:1px solid var(--line);
    border-left:4px solid #111827;
    box-shadow:0 1px 0 rgba(0,0,0,.03);
    margin-top:8px;
  }
  .band-day .section-head{margin-top:0}
  .band-store{
    background:linear-gradient(180deg,#eef2f7 0%,#f8fafc 100%);
    border:1px solid #d8dee8;
    border-left:4px solid #94a3b8;
    box-shadow:0 1px 0 rgba(0,0,0,.03);margin-top:8px;
  }
  .store-day-block{
    margin-top:18px;padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .band + .band{margin-top:20px}
  .funnel-warn{
    margin:0 0 12px;padding:10px 12px;border-radius:6px;
    background:#FFF8E7;border:1px solid var(--warn-bd);
    font-size:12px;line-height:1.5;color:#6b5a1e;
  }
  .brand-head{
    display:flex;align-items:center;margin-bottom:16px;min-height:32px;
  }
  .guest-hero{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    margin-bottom:16px;padding:14px 16px;border-radius:6px;border:1px solid var(--line);
  }
  .guest-hero.liyan{background:var(--liyan-soft);border-color:var(--liyan-line)}
  .guest-hero.gano{background:var(--gano-soft);border-color:var(--gano-line)}
  .guest-hero .lab{
    font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em;
  }
  .guest-hero .n{
    font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;
  }
  .guest-hero.liyan .n{color:var(--liyan)}
  .guest-hero.gano .n{color:var(--gano)}
  .card.total-card{padding:20px 18px}
  .card.total-card .guest-hero{padding:16px 18px;margin-bottom:18px}
  .card.total-card .guest-hero .n{font-size:40px}
  .card.total-card .kpi .n{font-size:24px}
  .card.total-card .kpi .n.sm{font-size:18px}
  .controls{display:flex;flex-direction:column;gap:8px;align-items:flex-end;min-width:260px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  label.field{font-size:12px;color:var(--muted)}
  input[type="date"]{
    height:34px;border:1px solid #d1d5db;border-radius:6px;
    background:#fff;padding:0 10px;font:inherit;color:var(--ink);
  }
  button.refresh-btn{
    height:34px;padding:0 12px;border-radius:6px;border:1px solid #111827;
    background:#111827;color:#fff;font:inherit;font-size:12px;font-weight:600;
    cursor:pointer;
  }
  button.refresh-btn:hover{background:#374151;border-color:#374151}
  button.refresh-btn:disabled{opacity:.55;cursor:wait}
  .void-switch{
    display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);
    user-select:none;cursor:pointer;
  }
  .void-switch input{
    appearance:none;width:34px;height:20px;border-radius:999px;border:1px solid #cfcfcf;
    background:#e5e7eb;position:relative;cursor:pointer;vertical-align:middle;
    transition:background .15s ease,border-color .15s ease;
  }
  .void-switch input::after{
    content:"";position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15);transition:transform .15s ease;
  }
  .void-switch input:checked{background:#111827;border-color:#111827}
  .void-switch input:checked::after{transform:translateX(14px)}
  .void-switch.on{color:var(--ink);font-weight:500}
  .void-tag{
    display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;
    font-size:10px;font-weight:600;color:#9a3412;background:#ffedd5;vertical-align:middle;
  }
  .void-tbl td.dim{color:#9ca3af}
  .live-status{
    font-size:11px;color:var(--muted);text-align:right;line-height:1.4;min-height:16px;
  }
  .live-status.ok{color:#166534}
  .live-status.err{color:#b91c1c}
  .live-status.busy{color:#92400e}
  .meta-line{
    font-size:12px;color:var(--muted);text-align:right;line-height:1.45;
  }
  .meta-line strong{color:var(--ink);font-weight:600}
  .warn{
    margin:16px 28px 0;
    background:var(--warn-bg);border:1px solid var(--warn-bd);
    border-radius:6px;padding:10px 14px;font-size:13px;line-height:1.5;
  }
  .body{padding:18px 28px 28px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:860px){.grid-2{grid-template-columns:1fr}}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px;
  }
  .card.liyan-card{border-top:3px solid var(--liyan)}
  .card.gano-card{border-top:3px solid var(--gano)}
  .card h2{
    margin:0 0 12px;font-size:14px;letter-spacing:.02em;font-weight:700;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .side .name-row{
    display:flex;align-items:center;gap:10px;margin-bottom:10px;
  }
  .side .name{
    font-size:16px;font-weight:800;letter-spacing:.02em;
  }
  .pill{
    font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px;
    border:1px solid currentColor;
  }
  .pill.liyan{color:var(--liyan);background:var(--liyan-soft)}
  .pill.gano{color:var(--gano);background:var(--gano-soft)}
  .kpi-groups{display:flex;flex-direction:column;gap:12px}
  .kpi-group{
    display:grid;gap:10px;
    padding:12px;
    border-radius:8px;
    background:#f3f4f6;
    border:1px solid var(--line);
  }
  .kpi-group.g4{grid-template-columns:repeat(4,1fr)}
  .kpi-group.g3{grid-template-columns:repeat(3,1fr)}
  .kpi-group.g2{grid-template-columns:repeat(2,1fr)}
  .kpi-group.g1{grid-template-columns:1fr}
  @media (max-width:720px){
    .kpi-group.g4{grid-template-columns:repeat(2,1fr)}
    .kpi-group.g3{grid-template-columns:1fr}
  }
  .kpi{
    background:#fff;border:1px solid var(--line);border-radius:6px;
    padding:14px 12px;text-align:center;
  }
  .kpi .n{
    font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;
    line-height:1.15;color:var(--ink);
  }
  .kpi .n.sm{font-size:17px;letter-spacing:-.01em}
  .kpi.liyan .n{color:var(--liyan)}
  .kpi.gano .n{color:var(--gano)}
  .kpi .l{
    margin-top:8px;font-size:12px;font-weight:400;color:var(--muted);
    line-height:1.35;letter-spacing:.02em;
  }
  .card.total-card .kpi-group .kpi .n{font-size:22px}
  .card.total-card .kpi-group .kpi .n.sm{font-size:17px}
  /* 累计漏斗：亮码 → 扫码 → 领取 → 核销（后台品牌累计口径） */
  .funnel{
    margin:0 0 14px;padding:14px 12px 12px;border-radius:8px;
    background:#fff;border:1px solid var(--line);
  }
  .funnel .frow{display:flex;align-items:flex-start;gap:2px}
  .funnel .step{flex:1;text-align:center;min-width:0}
  .funnel .step .fn{
    font-size:24px;font-weight:800;line-height:1.1;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  }
  .funnel.liyan .step .fn{color:var(--liyan)}
  .funnel.gano .step .fn{color:var(--gano)}
  .funnel .step .fl{
    margin-top:6px;font-size:11px;color:var(--muted);letter-spacing:.04em;
  }
  .funnel .arw{
    flex:0 0 44px;text-align:center;color:#9ca3af;font-size:12px;line-height:1.2;
    padding-top:2px;
  }
  .funnel .arw em{
    display:block;font-style:normal;font-size:10px;font-weight:700;
    font-variant-numeric:tabular-nums;margin-top:2px;color:#6b7280;
  }
  .funnel .arw.low em{color:#b45309}
  .funnel .cap{
    margin-top:10px;font-size:11px;color:var(--muted);line-height:1.5;
    border-top:1px dashed var(--line);padding-top:8px;
  }
  .day-note{
    margin:0 0 12px;font-size:12px;color:var(--muted);line-height:1.55;
    background:#f9fafb;border:1px solid var(--line);border-radius:6px;padding:9px 12px;
  }
  .card h2 .badge{
    font-size:11px;font-weight:600;color:var(--muted);
    background:#f3f4f6;border:1px solid var(--line);border-radius:999px;padding:2px 8px;
  }
  .card h2 .badge.scope-day{
    color:#111827;background:#eef2ff;border-color:#c7d2fe;
  }
  .card h2 .badge.scope-cum{
    color:#475569;background:#f1f5f9;border-color:#cbd5e1;
  }
  table.store-tbl td, table.store-tbl th{padding:7px 6px}
  table.store-tbl td.dim{color:#c0c4cc}
  table.store-tbl tr.zero td{color:#9ca3af}
  table.store-tbl tr.zero td:last-child{color:#9ca3af}
  table.store-tbl tfoot td{
    border-top:1px solid var(--line);border-bottom:none;
    font-weight:700;color:var(--ink);background:#fafbfc;
  }
  table.store-tbl tfoot td.dim{color:#c0c4cc;font-weight:400}
  .card .cap{
    margin-top:9px;font-size:11px;color:var(--muted);line-height:1.5;
    border-top:1px dashed var(--line);padding-top:8px;
  }
  .compare{
    margin-top:14px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;
  }
  .vs{
    align-self:center;width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:#fff;border:1px solid var(--line);
    font-size:12px;font-weight:700;color:var(--muted);
  }
  .side{padding:12px;border-radius:6px;border:1px solid transparent}
  .side.liyan{background:var(--liyan-soft);border-color:var(--liyan-line)}
  .side.gano{background:var(--gano-soft);border-color:var(--gano-line)}
  .side.liyan .name{color:var(--liyan)}
  .side.gano .name{color:var(--gano)}
  .side .metric{
    font-size:13px;line-height:1.65;color:var(--muted);
  }
  .side .metric b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .meter{margin-top:8px}
  .bar{height:8px;border-radius:4px;background:#eef2f7;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:4px}
  .bar.liyan>i{background:var(--liyan)}
  .bar.gano>i{background:var(--gano)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-weight:600}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .insights{display:grid;gap:8px}
  .insight{
    padding:12px 14px;border-radius:6px;background:#f9fafb;border:1px solid var(--line);
    font-size:13px;line-height:1.55;
  }
  .insight .tag{
    display:inline-block;font-size:11px;padding:2px 6px;border-radius:4px;margin-right:6px;
    background:#111827;color:#fff;font-weight:600;
  }
  .foot{
    margin-top:16px;padding-top:12px;border-top:1px solid var(--line);
    font-size:11px;color:var(--muted);line-height:1.6;
  }
  .empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>

me":"丽妍雅集Rubis SPA·凯德LuOne店","date":"2026-11-13","lightCount":4}],"scan":[{"brandType":2,"shopName":"GANO HAIR Salon·凯德虹口商业中心店","date":"2026-11-10","scanCount":2},{"brandType":2,"shopName":"GANO HAIR·长宁来福士店","date":"2026-11-10","scanCount":2},{"brandType":2,"shopName":"GANO HAIR·荟聚店","date":"2026-11-10","scanCount":1},{"brandType":1,"shopName":"丽妍雅集Rubis SPA·西岸中环店","date":"2026-11-11","scanCount":4},{"brandType":1,"shopName":"丽妍雅集Rubis SPA·LU1885陆里店","date":"2026-11-11","scanCount":2},{"brandType":1,"shopName":"丽妍雅集Rubis SPA·七宝领展广场店","date":"2026-11-11","scanCount":2},{"brandType":1,"shopName":"丽妍雅集Rubis SPA·光启城时尚购物中心店","date":"2026-11-11","scanCount":2},{"brandType":2,"shopName":"GANO HAIR·北外滩来福士店","date":"2026-11-11","scanCount":2},{"brandType":2,"shopName":"GANO hair 造型·苏州中心店","date":"2026-11-11","scanCount":2},{"brandType":2,"shopName":"GANO HAIR·凯德晶萃店","date":"2026-11-11","scanCount":2},{"brandType":2,"shopName":"GANO HAIR+奈造型设计·虹桥天地店","date":"2026-11-11","scanCount":1},{"brandType":2,"shopName":"GANO HAIR·长宁来福士店","date":"2026-11-11","scanCount":1},{"brandType":1,"shopName":"丽妍雅集Rubis SPA·瑞虹太阳宫店","date":"2026-11-12","scanCount":8},{"brandType":1,"shopName":"丽妍雅集Rubis SPA·浦东嘉里城店","date":"2026-11-12","scanCount":3},{"brandType":1,"shopName":"丽妍雅集Rubis SPA·久光百货店","date":"2026-11-12","scanCount":2},{"brandType":1,"shopName":"丽妍雅集Rubis SPA·长宁来福士广场店","date":"2026-11-12","scanCount":1},{"brandType":2,"shopName":"GANO HAIR·北外滩来福士店","date":"2026-11-12","scanCount":5},{"brandType":2,"shopName":"GANO HAIR·凯德晶萃店","date":"2026-11-12","scanCount":2},{"brandType":2,"shopName":"GANO HAIR·上海来福士人民广场店","date":"2026-11-12","scanCount":1},{"brandType":1,"shopName":"丽妍雅集Rubis SPA·凯德LuOne店","date":"2026-11-13","scanCount":2}]}}
</script>

<script>
(function () {
  const DAY_CUTOFF_HOUR = 22;
  /* 统计起点：自 2026-11-10 起（含当日） */
  const REPORT_START = "2026-11-10";
  const TZ = "Asia/Shanghai";
  /* 本地实时：须用 http://127.0.0.1:8788 打开；file:// 无法打到 API */
  const LIVE_INTERVAL_MS = 10 * 60 * 1000;
  const LIVE_TIMEOUT_MS = 45000;
  function liveApiUrl() {
    if (location.protocol === "file:") return null;
    return new URL("/api/alliance-live-snapshot", location.origin).href + "?t=" + Date.now();
  }

  const $ = (id) => document.getElementById(id);
  const dayInput = $("day");
  const reportEl = $("report");
  const incompleteBanner = $("incompleteBanner");
  const captureMeta = $("captureMeta");
  const sourceMeta = $("sourceMeta");
  const liveStatus = $("liveStatus");
  const refreshBtn = $("refreshBtn");
  const includeVoidInput = $("includeVoid");
  const voidSwitchLabel = $("voidSwitchLabel");

  let state = {
    captureAt: null,
    source: "—",
    day: null,
    staff: [],
    coupons: [],
    quotas: null,
    funnel: [],
    storeClicks: [],
    clicksByDay: { light: [], scan: [] },
    includeVoid: false,
  };

  function includeVoidOn() {
    return !!(includeVoidInput && includeVoidInput.checked);
  }

  function pad(n) { return String(n).padStart(2, "0"); }

  function nowInShanghai() {
    const fmt = new Intl.DateTimeFormat("en-CA", {
      timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
    });
    const parts = Object.fromEntries(fmt.formatToParts(new Date()).map((p) => [p.type, p.value]));
    return {
      date: `${parts.year}-${parts.month}-${parts.day}`,
      hour: Number(parts.hour),
      minute: Number(parts.minute),
      second: Number(parts.second),
      label: `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`,
    };
  }

  function formatCapture(isoOrDate) {
    if (!isoOrDate) return "—";
    if (typeof isoOrDate === "string" && /^\d{4}-\d{2}-\d{2} /.test(isoOrDate)) return isoOrDate;
    const d = isoOrDate instanceof Date ? isoOrDate : new Date(isoOrDate);
    const fmt = new Intl.DateTimeFormat("sv-SE", {
      timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
    });
    return fmt.format(d).replace("T", " ");
  }

  function sideOfStore(name) {
    const s = String(name || "");
    if (/丽妍|Rubis|雅集/i.test(s)) return "liyan";
    if (/GANO|奈造型/i.test(s)) return "gano";
    return "other";
  }

  function sideOfCompany(c) {
    const s = String(c || "");
    if (/丽妍/i.test(s)) return "liyan";
    if (/GANO/i.test(s)) return "gano";
    return "other";
  }

  /* 发券侧别：优先后台 brandType（1=丽妍 2=GANO），避免店名误判 */
  function issueSideOf(c) {
    const bt = String(c.issueBrandType ?? c.brandType ?? "");
    if (bt === "1" || /丽妍/i.test(bt)) return "liyan";
    if (bt === "2" || /GANO/i.test(bt)) return "gano";
    return sideOfStore(issueStore(c));
  }

  function isVoid(c) {
    if (c.voidTime) return true;
    const st = String(c.status || c.state || c.couponStatus || "");
    /* 后台码：5=作废；也兼容中文/英文态 */
    return st === "5" || /作废|void|cancel|revoked|invalid/i.test(st);
  }

  const LOGO = {
    liyan: "./assets/brand/logo-liyan.svg",
    gano: "./assets/brand/logo-gano.svg",
  };
  const BRAND = { liyan: "丽妍雅集", gano: "GANO HAIR" };

  function isRedeemed(c) {
    if (isVoid(c)) return false;
    if (c.redeemTime || c.usedTime || c.verifyTime) return true;
    const st = String(c.status || c.state || c.couponStatus || "");
    /* 后台码常见：3/4=已核销（以 redeemTime 为准；码表兜底） */
    return st === "3" || st === "4" || /已核销|已使用|used|redeem/i.test(st);
  }

  function issueTime(c) {
    return String(c.claimTime || c.receiveTime || c.issueTime || c.issuedAt || c.grantTime || c.createTime || "");
  }

  function redeemTime(c) {
    return String(c.redeemTime || c.usedTime || c.verifyTime || "");
  }

  function issueStore(c) {
    return c.issueStoreName || c.issueShopName || c.fromStoreName || c.storeName || c.issueStore || "未知门店";
  }

  function redeemStore(c) {
    return c.redeemStoreName || c.redeemShopName || c.usedStoreName || c.verifyStoreName || c.redeemStore || "—";
  }

  function priceOf(c) {
    const p = c.price ?? c.couponPrice ?? c.amount ?? c.facePrice;
    const n = Number(p);
    return Number.isFinite(n) ? n : 0;
  }

  function dayKey(ts) {
    return String(ts || "").slice(0, 10);
  }

  function yen(n) {
    return "¥" + Math.round(n).toLocaleString("zh-CN");
  }

  function pct(a, b) {
    if (!b) return "—";
    return (Math.round((a / b) * 1000) / 10) + "%";
  }

  function rankMap(map, limit) {
    return Object.entries(map)
      .filter(([k]) => k && k !== "—")
      .sort((a, b) => b[1].count - a[1].count || b[1].amount - a[1].amount)
      .slice(0, limit);
  }

  function sideBucket() {
    return {
      lightCount: 0, scanCount: 0,
      issueCount: 0, issueAmount: 0,
      redeemedOwnCount: 0, redeemedOwnAmount: 0,
      redeemCount: 0, redeemAmount: 0,
      guestCount: 0, guestAmount: 0,
      activeStaff: new Set(),
      issueStores: {},
      redeemStores: {},
      products: {},
    };
  }

  function bumpStore(bag, store, amount) {
    if (!bag[store]) bag[store] = { count: 0, amount: 0 };
    bag[store].count += 1;
    bag[store].amount += amount;
  }

  function accumulateIssues(sides, coupons) {
    coupons.forEach((c) => {
      const store = issueStore(c);
      const side = issueSideOf(c);
      const b = sides[side] || sides.other;
      const price = priceOf(c);
      b.issueCount += 1;
      b.issueAmount += price;
      const phone = c.issuerPhone || c.issueStaffPhone || c.staffPhone || "";
      if (phone) b.activeStaff.add(phone);
      bumpStore(b.issueStores, store, price);
      const pname = c.couponName || c.name || c.productName || "未命名券";
      if (!b.products[pname]) b.products[pname] = { issue: 0, redeem: 0, price };
      b.products[pname].issue += 1;
    });
  }

  function accumulateRedeems(sides, coupons) {
    coupons.forEach((c) => {
      const store = redeemStore(c);
      const redeemSide = sideOfStore(store);
      const issueSide = issueSideOf(c);
      const side = redeemSide !== "other" ? redeemSide : issueSide;
      const b = sides[side] || sides.other;
      const price = priceOf(c);
      b.redeemCount += 1;
      b.redeemAmount += price;
      bumpStore(b.redeemStores, store, price);
      const pname = c.couponName || c.name || c.productName || "未命名券";
      if (!b.products[pname]) b.products[pname] = { issue: 0, redeem: 0, price };
      b.products[pname].redeem += 1;
      /* 被核销 = 本侧发出且已核销（按核销日计入） */
      const own = sides[issueSide] || sides.other;
      own.redeemedOwnCount += 1;
      own.redeemedOwnAmount += price;
      /* 获客 = 对方发出、在本侧门店核销（跨品牌到店新客） */
      if (redeemSide === "liyan" && issueSide === "gano") {
        sides.liyan.guestCount += 1;
        sides.liyan.guestAmount += price;
      } else if (redeemSide === "gano" && issueSide === "liyan") {
        sides.gano.guestCount += 1;
        sides.gano.guestAmount += price;
      }
    });
  }

  function cumFunnelOf() {
    const map = {};
    (state.funnel || []).forEach((f) => {
      const bt = String(f.brandType ?? "");
      const side = bt === "1" ? "liyan" : bt === "2" ? "gano" : sideOfStore(f.brandName);
      map[side] = {
        light: Number(f.issueCount) || 0,
        scan: Number(f.scanCount) || 0,
        claim: Number(f.claimCount) || 0,
        redeem: Number(f.redeemCount) || 0,
      };
    });
    return map;
  }

  function analyze(day) {
    const staff = state.staff || [];
    const raw = state.coupons || [];
    const withVoid = includeVoidOn();
    /* 默认剔作废；打开「含作废数据」后券相关统计含作废。亮码/扫码仍走点击表，不受此开关影响 */
    const inRange = raw.filter((c) => dayKey(issueTime(c)) >= REPORT_START);
    const coupons = withVoid ? inRange : inRange.filter((c) => !isVoid(c));
    const voidCoupons = inRange.filter((c) => isVoid(c));

    const covered = { liyan: 0, gano: 0, other: 0 };
    staff.forEach((s) => {
      const side = sideOfCompany(s.companyName || s.company || s.orgName) || sideOfStore(s.storeName || s.shopName);
      covered[side] = (covered[side] || 0) + 1;
    });

    const dayCoupons = coupons.filter((c) => dayKey(issueTime(c)) === day);
    const dayRedeems = coupons.filter((c) => isRedeemed(c) && dayKey(redeemTime(c)) === day);
    const allRedeems = coupons.filter((c) => isRedeemed(c));

    const sides = { liyan: sideBucket(), gano: sideBucket(), other: sideBucket() };
    const totals = { liyan: sideBucket(), gano: sideBucket(), other: sideBucket() };

    accumulateIssues(sides, dayCoupons);
    accumulateRedeems(sides, dayRedeems);
    accumulateIssues(totals, coupons);
    accumulateRedeems(totals, allRedeems);

    return {
      covered,
      sides,
      totals,
      dayCoupons,
      dayRedeems,
      validCoupons: coupons,
      voidCoupons,
      voidTotal: voidCoupons.length,
      includeVoid: withVoid,
      staffTotal: staff.length,
    };
  }

  function renderVoidList(voidCoupons) {
    if (!voidCoupons || !voidCoupons.length) {
      return `<div class="card"><h2>作废券明细</h2><div class="empty">当前区间无作废券</div></div>`;
    }
    const rows = voidCoupons
      .slice()
      .sort((a, b) => String(issueTime(b)).localeCompare(String(issueTime(a))))
      .map((c) => {
        const side = issueSideOf(c);
        const brand = BRAND[side] || "—";
        return `<tr>
          <td>${c.couponNo || c.couponId || "—"} <span class="void-tag">作废</span></td>
          <td>${brand}</td>
          <td>${shortStore(issueStore(c))}</td>
          <td>${c.couponName || "—"}</td>
          <td>${dayKey(issueTime(c)) || "—"}</td>
          <td class="dim">${c.voidTime || "—"}</td>
          <td class="dim">${c.voidReason || c.voidOperatorName || "—"}</td>
        </tr>`;
      })
      .join("");
    return `<div class="card">
      <h2>作废券明细 <span class="badge">共 ${voidCoupons.length} 张</span></h2>
      <table class="void-tbl">
        <thead><tr>
          <th>券码</th><th>发券品牌</th><th>发券门店</th><th>券种</th><th>领取日</th><th>作废时间</th><th>原因/操作人</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="cap">打开「含作废数据」后计入上方发券/领取与漏斗领取·被核销；亮码/扫码仍不含作废口径变化。</div>
    </div>`;
  }

  function renderFunnel(cls, f, capText) {
    if (!f) {
      return `<div class="funnel ${cls}"><div class="empty">后台未返回该品牌漏斗</div></div>`;
    }
    const rate = (a, b) => (b ? (Math.round((a / b) * 1000) / 10) + "%" : "—");
    const r1 = rate(f.scan, f.light);
    const r2 = rate(f.claim, f.scan);
    /* 本品牌发出的券，由对方门店核销 = 被核销（与 4 段口径同源） */
    const r3 = rate(f.redeem, f.claim);
    const low = (a, b) => (b && a / b < 0.5 ? " low" : "");
    const cap = capText || `口径：本品牌发出的礼遇码，统计自 ${REPORT_START}。亮码/扫码取自生产库联盟点击明细（按日可切）；领取/被核销取自有效券明细。`;
    return `
      <div class="funnel ${cls}">
        <div class="frow">
          <div class="step"><div class="fn">${f.light}</div><div class="fl">亮码</div></div>
          <div class="arw${low(f.scan, f.light)}">→<em>${r1}</em></div>
          <div class="step"><div class="fn">${f.scan}</div><div class="fl">扫码</div></div>
          <div class="arw${low(f.claim, f.scan)}">→<em>${r2}</em></div>
          <div class="step"><div class="fn">${f.claim}</div><div class="fl">领取</div></div>
          <div class="arw${low(f.redeem, f.claim)}">→<em>${r3}</em></div>
          <div class="step"><div class="fn">${f.redeem}</div><div class="fl">被核销</div></div>
        </div>
        <div class="cap">${cap}</div>
      </div>`;
  }

  /* 门店明细：领取 / 被核销取券明细真数；亮码、扫码后台只到品牌级，无门店拆分 */
  function shortStore(name) {
    return String(name || "")
      .replace(/^丽妍雅集\s*Rubis\s*SPA\s*[·・]\s*/i, "")
      .replace(/^GANO\s*HAIR\s*(Salon|\+奈造型设计)?\s*[·・]\s*/i, "")
      .replace(/^GANO\s*hair\s*造型\s*[·・]\s*/i, "") || String(name || "");
  }

  /* claimCoupons：计入「领取」；redeemCoupons：按发券门店计入「被核销」（可不与领取同一批） */
  function storeRows(side, staff, claimCoupons, redeemCoupons) {
    const map = {};
    staff.forEach((s) => {
      const sd = sideOfCompany(s.companyName || s.brandName) || sideOfStore(s.storeName || s.shopName);
      if (sd !== side) return;
      const name = s.storeName || s.shopName;
      if (name) map[name] = map[name] || { store: name, claim: 0, redeemed: 0 };
    });
    (claimCoupons || []).forEach((c) => {
      if (issueSideOf(c) !== side) return;
      const name = issueStore(c);
      if (!map[name]) map[name] = { store: name, claim: 0, redeemed: 0 };
      map[name].claim += 1;
    });
    const redeemSrc = redeemCoupons != null
      ? redeemCoupons
      : (claimCoupons || []).filter((c) => isRedeemed(c));
    redeemSrc.forEach((c) => {
      if (issueSideOf(c) !== side) return;
      const name = issueStore(c);
      if (!map[name]) map[name] = { store: name, claim: 0, redeemed: 0 };
      map[name].redeemed += 1;
    });
    return Object.values(map).sort(
      (a, b) => b.claim - a.claim || b.redeemed - a.redeemed || a.store.localeCompare(b.store, "zh")
    );
  }

  function renderStoreCard(cls, rows, clicksByStore, opts) {
    const o = opts || {};
    const scope = o.scope === "day" ? "day" : "cum";
    const fillZero = !!o.fillZero;
    const sum = rows.reduce((n, r) => n + r.claim, 0);
    const redeemed = rows.reduce((n, r) => n + r.redeemed, 0);
    const pick = (store, key) => {
      const hit = clicksByStore && clicksByStore[normStore(store)];
      if (hit) {
        const v = hit[key];
        if (v === null || v === undefined || v === "" || Number.isNaN(Number(v))) {
          return fillZero ? 0 : null;
        }
        return Number(v);
      }
      return fillZero ? 0 : null;
    };
    const cell = (v) => (v === null ? `<td class="num dim">—</td>` : `<td class="num">${v}</td>`);
    const hasClicks = fillZero
      || rows.some((r) => pick(r.store, "light") !== null || pick(r.store, "scan") !== null);
    const rowActive = (r) =>
      (pick(r.store, "light") || 0) + (pick(r.store, "scan") || 0) + r.claim + r.redeemed > 0;
    const active = rows.filter(rowActive).length;
    const badgeText = scope === "day"
      ? `当日 · 有数 ${active}/${rows.length} 家`
      : `累计 · 出单 ${rows.filter((r) => r.claim > 0).length}/${rows.length} 家`;
    const body = rows.map((r) => `
      <tr class="${rowActive(r) ? "" : "zero"}">
        <td>${shortStore(r.store)}</td>
        ${cell(pick(r.store, "light"))}
        ${cell(pick(r.store, "scan"))}
        <td class="num">${r.claim}</td>
        <td class="num">${r.redeemed}</td>
      </tr>`).join("");
    const sumLight = rows.reduce((n, r) => n + (pick(r.store, "light") || 0), 0);
    const sumScan = rows.reduce((n, r) => n + (pick(r.store, "scan") || 0), 0);
    const cap = o.cap || (hasClicks
      ? "亮码/扫码按门店取自生产库联盟点击明细；领取/被核销按发券门店归属，只统计有效券。"
      : "亮码/扫码暂无门店拆分，以「—」表示；领取/被核销按发券门店归属，只统计有效券。");
    return `
      <div class="card ${cls}-card">
        <h2>${BRAND[cls]} · 门店明细 <span class="badge scope-${scope}">${badgeText}</span></h2>
        <table class="store-tbl">
          <thead><tr>
            <th>门店</th><th class="num">亮码</th><th class="num">扫码</th>
            <th class="num">领取</th><th class="num">被核销</th>
          </tr></thead>
          <tbody>${body}</tbody>
          <tfoot><tr>
            <td>合计</td>
            ${cell(hasClicks ? sumLight : null)}
            ${cell(hasClicks ? sumScan : null)}
            <td class="num">${sum}</td><td class="num">${redeemed}</td>
          </tr></tfoot>
        </table>
        <div class="cap">${cap}</div>
      </div>`;
  }

  function renderBrandCard(cls, side, funnel, funnelCap) {
    const redeemedRate = pct(side.redeemedOwnCount, side.issueCount);
    return `
      <div class="card ${cls}-card total-card">
        <div class="brand-head">
          <img class="logo xl ${cls}" src="${LOGO[cls]}" alt="${BRAND[cls]}" />
        </div>
        <div class="guest-hero ${cls}">
          <div class="lab">获客</div>
          <div class="n">${side.guestCount}</div>
        </div>
        ${renderFunnel(cls, funnel, funnelCap)}
        <div class="kpi-groups">
          <div class="kpi-group g2">
            <div class="kpi ${cls}"><div class="n">${side.issueCount}</div><div class="l">发券</div></div>
            <div class="kpi ${cls}"><div class="n">${side.redeemedOwnCount}</div><div class="l">被核销</div></div>
          </div>
          <div class="kpi-group g1">
            <div class="kpi ${cls}"><div class="n">${side.redeemCount}</div><div class="l">核销</div></div>
          </div>
          <div class="kpi-group g3">
            <div class="kpi ${cls}"><div class="n sm">${redeemedRate}</div><div class="l">被核销率</div></div>
            <div class="kpi ${cls}"><div class="n">${side.activeStaff.size}</div><div class="l">发券员工</div></div>
            <div class="kpi ${cls}"><div class="n sm">${yen(side.issueAmount)}</div><div class="l">发券金额</div></div>
          </div>
        </div>
      </div>`;
  }

  function dayFunnelOf(day, sides) {
    const by = state.clicksByDay || {};
    const lightRows = by.light || [];
    const scanRows = by.scan || [];
    const sumDay = (rows, side, field) => {
      const bt = side === "liyan" ? "1" : side === "gano" ? "2" : "";
      return rows
        .filter((r) => String(r.date) === day && String(r.brandType) === bt)
        .reduce((n, r) => n + (Number(r[field] ?? r.n) || 0), 0);
    };
    const out = {};
    ["liyan", "gano"].forEach((k) => {
      const s = sides[k] || {};
      out[k] = {
        light: sumDay(lightRows, k, "lightCount"),
        scan: sumDay(scanRows, k, "scanCount"),
        claim: Number(s.issueCount) || 0,
        redeem: Number(s.redeemedOwnCount) || 0,
      };
    });
    return out;
  }

  function renderRankTable(title, rows, cls) {
    const cardCls = cls ? `card ${cls}-card` : "card";
    if (!rows.length) return `<div class="${cardCls}"><h2>${title}</h2><div class="empty">暂无排行数据</div></div>`;
    const body = rows.map((r, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${r[0]}</td>
        <td class="num">${r[1].count}</td>
        <td class="num">${yen(r[1].amount)}</td>
      </tr>`).join("");
    return `<div class="${cardCls}"><h2>${title}</h2>
      <table><thead><tr><th>#</th><th>门店</th><th class="num">张数</th><th class="num">金额</th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
  }

  /* 门店维度亮码/扫码：快照若提供 storeClicks 则直读。
     后台目前仅品牌级，故通常为空；接入导出后按以下任一字段名均可识别：
       { brandType|brandName|companyName, shopName|storeName|门店|店铺, lightCount|issueCount|亮码|亮码次数, scanCount|扫码|扫码次数 } */
  function normStore(name) {
    return String(name || "")
      .replace(/[\s·・\-—_()（）]/g, "")
      .replace(/^丽妍雅集(rubis)?(spa)?/i, "")
      .replace(/^gano(hair)?(salon)?(\+奈造型设计)?/i, "")
      .toLowerCase();
  }

  function brandSideOfClick(r) {
    const brand = String(r.brandType ?? r.brandName ?? r.companyName ?? "");
    if (brand === "1") return "liyan";
    if (brand === "2") return "gano";
    if (/丽妍|Rubis/i.test(brand)) return "liyan";
    if (/GANO/i.test(brand)) return "gano";
    return "other";
  }

  function clicksByStoreOf(side) {
    const out = {};
    (state.storeClicks || []).forEach((r) => {
      if (brandSideOfClick(r) !== side) return;
      const name = r.shopName || r.storeName || r["门店"] || r["店铺"];
      if (!name) return;
      const light = r.lightCount ?? r.issueCount ?? r["亮码"] ?? r["亮码次数"];
      const scan = r.scanCount ?? r["扫码"] ?? r["扫码次数"];
      out[normStore(name)] = {
        light: light === null || light === undefined || light === "" ? null : Number(light),
        scan: scan === null || scan === undefined || scan === "" ? null : Number(scan),
      };
    });
    return out;
  }

  /* 按日门店亮码/扫码；无记录的门店不写字段，渲染时显示 0（有按日源）或 —（无源） */
  function clicksByStoreOfDay(side, day) {
    const by = state.clicksByDay || {};
    const out = {};
    const bump = (rows, field) => {
      (rows || []).forEach((r) => {
        if (String(r.date) !== day) return;
        if (brandSideOfClick(r) !== side) return;
        const name = r.shopName || r.storeName || r["门店"] || r["店铺"];
        if (!name) return;
        const k = normStore(name);
        if (!out[k]) out[k] = { light: 0, scan: 0, _name: name };
        out[k][field] += Number(r[field === "light" ? "lightCount" : "scanCount"] ?? r.n) || 0;
      });
    };
    bump(by.light, "light");
    bump(by.scan, "scan");
    return out;
  }

  function render() {
    /* 统计自 REPORT_START 起：早于起点的日期一律归到起点 */
    let day = dayInput.value || nowInShanghai().date;
    if (day < REPORT_START) day = REPORT_START;
    if (dayInput.value !== day) dayInput.value = day;
    state.day = day;
    const now = nowInShanghai();
    const isToday = day === now.date;
    const incomplete = isToday && now.hour < DAY_CUTOFF_HOUR;
    incompleteBanner.hidden = !incomplete;

    captureMeta.innerHTML = `数据截取时间：<strong>${formatCapture(state.captureAt)}</strong>`;
    if (incomplete) {
      captureMeta.innerHTML += ` · 日结截断点 <strong>${day} ${DAY_CUTOFF_HOUR}:00:00</strong>（尚未到达）`;
    } else if (isToday) {
      captureMeta.innerHTML += ` · 已过 <strong>${day} ${DAY_CUTOFF_HOUR}:00</strong>，可作当日参考日结`;
    }
    state.includeVoid = includeVoidOn();
    if (voidSwitchLabel) voidSwitchLabel.classList.toggle("on", state.includeVoid);

    const a = analyze(day);
    const L = a.sides.liyan;
    const G = a.sides.gano;
    const TL = a.totals.liyan;
    const TG = a.totals.gano;
    const couponTotal = a.totals.liyan.issueCount + a.totals.gano.issueCount + a.totals.other.issueCount;

    let sourceText = `数据来源：${state.source}`;
    if (state.includeVoid) {
      sourceText += ` · 含作废 ${a.voidTotal} 张`;
    }
    sourceMeta.textContent = sourceText;

    const funnelWarns = [];
    const CF = cumFunnelOf();
    /* 领取/被核销随「含作废」开关与券明细对齐；亮码/扫码仍用点击表累计 */
    ["liyan", "gano"].forEach((k) => {
      if (!CF[k]) return;
      CF[k].claim = a.totals[k].issueCount;
      CF[k].redeem = a.totals[k].redeemedOwnCount;
    });
    const DF = dayFunnelOf(day, a.sides);
    const LROWS = storeRows("liyan", state.staff, a.validCoupons);
    const GROWS = storeRows("gano", state.staff, a.validCoupons);
    const LDAY = storeRows("liyan", state.staff, a.dayCoupons, a.dayRedeems);
    const GDAY = storeRows("gano", state.staff, a.dayCoupons, a.dayRedeems);
    const hasDayClicks = !!(state.clicksByDay
      && ((state.clicksByDay.light && state.clicksByDay.light.length)
        || (state.clicksByDay.scan && state.clicksByDay.scan.length)));
    const voidNote = state.includeVoid ? "（含作废券）" : "（不含作废）";
    const dayStoreCap = hasDayClicks
      ? `当日 ${day}：亮码/扫码取自生产库按日门店明细；领取=当日领取，被核销=当日核销（均按发券门店归属）${voidNote}。列全部门店。`
      : `当日 ${day}：亮码/扫码暂无按日门店拆分；领取/被核销按发券门店归属${voidNote}。列全部门店。`;
    const cumStoreCap = `累计自 ${REPORT_START}：亮码/扫码取自生产库门店明细；领取/被核销按发券门店归属${voidNote}。列全部授权门店。`;
    ["liyan", "gano"].forEach((k) => {
      const f = CF[k];
      if (!f) funnelWarns.push(`${BRAND[k]}：后台累计漏斗缺数，请重新拉取券点击明细`);
    });
    const couponCap = state.includeVoid ? "含作废券明细" : "有效券明细";
    const dayFunnelCap = `口径：本品牌发出的礼遇码，当日 ${day}。亮码/扫码取自生产库联盟点击明细；领取/被核销取自当日${couponCap}。`;
    const cumFunnelCap = `口径：本品牌发出的礼遇码，统计自 ${REPORT_START}。亮码/扫码取自生产库联盟点击明细；领取/被核销取自${couponCap}。`;
    const couponHint = state.includeVoid
      ? `不随统计日切换 · 含作废共 ${couponTotal} 张（其中作废 ${a.voidTotal} 张）`
      : `不随统计日切换 · 仅含有效券 ${couponTotal} 张`;

    reportEl.innerHTML = `
      <section class="band band-total">
        <div class="section-head">
          <h2 class="eyebrow">活动累计 · 自 ${REPORT_START}</h2>
          <div class="hint">${couponHint}</div>
        </div>
        <div class="grid-2">
          ${renderBrandCard("liyan", TL, CF.liyan, cumFunnelCap)}
          ${renderBrandCard("gano", TG, CF.gano, cumFunnelCap)}
        </div>
      </section>

      <section class="band band-day">
        <div class="section-head">
          <h2 class="eyebrow"><span class="chip">当日 · ${day}</span></h2>
          <div class="hint">仅统计日 ${day}（不含其他日期）· 当日发券 ${a.dayCoupons.length}${state.includeVoid ? "（含作废）" : ""} · 授权 ${a.staffTotal}</div>
        </div>
        ${funnelWarns.length ? `<div class="funnel-warn">${funnelWarns.join("<br>")}</div>` : ""}
        <div class="day-note">以下为 <strong>仅 ${day}</strong> 的亮码 / 扫码 / 领取 / 被核销，与上方「活动累计」分开统计，不含 ${REPORT_START} 其他日期。</div>
        <div class="grid-2">
          ${renderBrandCard("liyan", L, DF.liyan, dayFunnelCap)}
          ${renderBrandCard("gano", G, DF.gano, dayFunnelCap)}
        </div>

        <div class="store-day-block">
          <div class="section-head">
            <h2 class="eyebrow"><span class="chip">当日 · ${day}</span> 门店明细 · 亮码 / 扫码 / 领取 / 被核销</h2>
            <div class="hint">仅 ${day} 当日 · 不含累计 · 列全部授权门店 · 丽妍 ${LDAY.length} 家 / GANO ${GDAY.length} 家</div>
          </div>
          <div class="grid-2">
            ${renderStoreCard("liyan", LDAY, clicksByStoreOfDay("liyan", day), { scope: "day", fillZero: hasDayClicks, cap: dayStoreCap })}
            ${renderStoreCard("gano", GDAY, clicksByStoreOfDay("gano", day), { scope: "day", fillZero: hasDayClicks, cap: dayStoreCap })}
          </div>
        </div>

        <div class="section-head" style="margin-top:18px">
          <h2 class="eyebrow">当日门店排行</h2>
        </div>
        <div class="grid-2">
          ${renderRankTable("丽妍 · 发券门店 Top", rankMap(L.issueStores, 5), "liyan")}
          ${renderRankTable("GANO · 发券门店 Top", rankMap(G.issueStores, 5), "gano")}
          ${renderRankTable("丽妍 · 核销门店 Top", rankMap(L.redeemStores, 5), "liyan")}
          ${renderRankTable("GANO · 核销门店 Top", rankMap(G.redeemStores, 5), "gano")}
        </div>
      </section>

      <section class="band band-store">
        <div class="section-head">
          <h2 class="eyebrow">活动累计 · 自 ${REPORT_START} · 门店明细 · 亮码 / 扫码 / 领取 / 被核销</h2>
          <div class="hint">不随统计日切换 · 列全部授权门店 · 丽妍 ${LROWS.length} 家 / GANO ${GROWS.length} 家</div>
        </div>
        <div class="grid-2">
          ${renderStoreCard("liyan", LROWS, clicksByStoreOf("liyan"), { scope: "cum", fillZero: true, cap: cumStoreCap })}
          ${renderStoreCard("gano", GROWS, clicksByStoreOf("gano"), { scope: "cum", fillZero: true, cap: cumStoreCap })}
        </div>
      </section>

      ${state.includeVoid ? `<section class="band band-void">${renderVoidList(a.voidCoupons)}</section>` : ""}
    `;
  }

  /* DATA UPDATE PROTOCOL（以后更新必须遵守）
   * 1. 只能写入后台真数：staff/page + coupon/issued + coupon/quotas + coupon/clicks
   * 2. 覆盖 data/alliance-daily-snapshot.json，再运行 node _sync-live-snapshot.mjs 同步 #live-snapshot
   * 3. 禁止虚构券行 / 禁止用「演示数据」冒充日结
   * 4. 快照含作废券；看板默认过滤；「含作废数据」打开后计入券相关 KPI/漏斗领取·被核销
   * 5. 更新后自检：有效券数 + 作废数 = 快照 coupons 合计；默认关时有效券 ≈ quotas.claimed
   * 6. source 必须含「后台已核对快照」字样
   */
  function snapshotToData(s) {
    if (!s || !Array.isArray(s.coupons)) throw new Error("快照无 coupons");
    if (/^演示数据|结构对齐后台/.test(s.source || "")) throw new Error("拒绝演示数据快照");
    return {
      staff: s.staff || [],
      coupons: s.coupons || [],
      quotas: s.quotas,
      funnel: s.funnelCumulative || [],
      storeClicks: s.storeClicks || [],
      clicksByDay: s.clicksByDay || s.byDay || { light: [], scan: [] },
      source: s.source || ("后台已核对快照 · " + (s.capturedAt || "")),
      captureAt: s.capturedAt || null,
    };
  }

  function loadEmbeddedSnapshot() {
    const el = document.getElementById("live-snapshot");
    if (!el || !el.textContent.trim()) throw new Error("缺少 #live-snapshot 真数快照");
    return snapshotToData(JSON.parse(el.textContent));
  }

  function setLiveStatus(text, kind) {
    if (!liveStatus) return;
    liveStatus.textContent = text;
    liveStatus.className = "live-status" + (kind ? " " + kind : "");
  }

  function applyData({ staff, coupons, quotas, funnel, storeClicks, clicksByDay, source, captureAt }) {
    if (/^演示数据|结构对齐后台/.test(String(source || ""))) {
      throw new Error("拒绝写入演示数据");
    }
    state.staff = staff || [];
    state.coupons = coupons || [];
    state.quotas = quotas;
    state.funnel = funnel || [];
    state.storeClicks = storeClicks || [];
    state.clicksByDay = clicksByDay || { light: [], scan: [] };
    state.source = source || "—";
    state.captureAt = captureAt || nowInShanghai().label;
    try {
      localStorage.setItem("allianceDailyReport.cache", JSON.stringify({
        ver: 5,
        at: state.captureAt,
        source: state.source,
        staff: state.staff,
        coupons: state.coupons,
        quotas: state.quotas,
      }));
    } catch (e) {}
    render();
  }

  let liveTimer = null;
  let liveBusy = false;

  async function fetchLiveSnapshot() {
    const url = liveApiUrl();
    if (!url) {
      throw new Error("请用本地服务打开：http://127.0.0.1:8788/alliance-daily-report.html（不要直接打开文件）");
    }
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), LIVE_TIMEOUT_MS);
    try {
      const res = await fetch(url, { cache: "no-store", signal: ctrl.signal });
      const raw = await res.json();
      if (!res.ok || raw.ok === false) {
        throw new Error((raw && raw.error) || ("HTTP " + res.status));
      }
      return snapshotToData(raw);
    } catch (err) {
      if (err && err.name === "AbortError") throw new Error("刷新超时，请确认已启动 node serve-daily-report.mjs");
      throw err;
    } finally {
      clearTimeout(timer);
    }
  }

  async function refreshLive(reason) {
    if (liveBusy) {
      setLiveStatus("本地实时：正在刷新，请稍候…", "busy");
      return;
    }
    liveBusy = true;
    if (refreshBtn) refreshBtn.disabled = true;
    setLiveStatus(reason === "auto" ? "本地实时：定时刷新中…" : "本地实时：刷新中…", "busy");
    try {
      const data = await fetchLiveSnapshot();
      applyData(data);
      const next = new Date(Date.now() + LIVE_INTERVAL_MS);
      const hh = String(next.getHours()).padStart(2, "0");
      const mm = String(next.getMinutes()).padStart(2, "0");
      setLiveStatus(`本地实时：已更新 · 每 10 分钟自动刷新 · 下次约 ${hh}:${mm}`, "ok");
    } catch (err) {
      setLiveStatus("本地实时失败（仍显示当前快照）：" + (err && err.message ? err.message : err), "err");
    } finally {
      liveBusy = false;
      if (refreshBtn) refreshBtn.disabled = false;
    }
  }

  function startLivePolling() {
    if (liveTimer) clearInterval(liveTimer);
    liveTimer = setInterval(() => refreshLive("auto"), LIVE_INTERVAL_MS);
  }

  async function boot() {
    const now = nowInShanghai();
    dayInput.min = REPORT_START;
    dayInput.value = now.date < REPORT_START ? REPORT_START : now.date;
    try {
      localStorage.removeItem("allianceDailyReport.cache");
    } catch (e) {}
    /* 先嵌入快照占位，再拉本地实时 API */
    try {
      applyData(loadEmbeddedSnapshot());
    } catch (e) {
      reportEl.innerHTML = `<div class="empty">快照加载失败：${e.message || e}</div>`;
    }
    await refreshLive("boot");
    startLivePolling();
  }

  dayInput.addEventListener("change", render);
  if (includeVoidInput) {
    includeVoidInput.checked = false;
    includeVoidInput.addEventListener("change", render);
  }
  if (refreshBtn) refreshBtn.addEventListener("click", () => refreshLive("manual"));
  boot();
})();
</script>
</body>
</html>
