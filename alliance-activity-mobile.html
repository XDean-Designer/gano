<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>联盟活动数据</title>
<style>
  @font-face{
    font-family:"Noto Sans SC";
    src:url("./fonts/NotoSansSC-VF.ttf") format("truetype");
    font-weight:100 900;
    font-style:normal;
    font-display:swap;
  }
  :root{
    --ink:#1a1a1a;
    --muted:#6b7280;
    --line:#e5e7eb;
    --page:#f3f4f6;
    --card:#ffffff;
    --liyan:#C62828;
    --liyan-soft:#FDECEC;
    --liyan-line:#F5C2C2;
    --gano:#1565C0;
    --gano-soft:#E8F1FB;
    --gano-line:#B6D0F0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:var(--page);
    padding:16px 14px calc(28px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:480px;margin:0 auto}
  .hero{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 16px 14px;
    margin-bottom:14px;
  }
  .hero-title{
    display:flex;align-items:center;gap:10px;
  }
  .hero-title .app-logo{
    width:32px;height:32px;border-radius:8px;flex:0 0 auto;
    object-fit:cover;display:block;
  }
  .hero h1{
    margin:0;font-size:26px;font-weight:800;letter-spacing:.02em;line-height:1.25;
  }
  .controls{
    margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  }
  input[type="date"]{
    flex:1 1 150px;min-height:48px;border:1px solid #d1d5db;border-radius:10px;
    background:#fff;padding:0 12px;font:inherit;font-size:17px;color:var(--ink);
  }
  button.refresh-btn{
    flex:0 0 auto;min-height:48px;padding:0 18px;border-radius:10px;
    border:1px solid #111827;background:#111827;color:#fff;
    font:inherit;font-size:16px;font-weight:700;cursor:pointer;
  }
  button.refresh-btn:disabled{opacity:.55;cursor:wait}
  .live-status{
    margin-top:10px;font-size:13px;color:var(--muted);line-height:1.4;min-height:18px;
  }
  .live-status.ok{color:#166534}
  .live-status.err{color:#b91c1c}
  .live-status.busy{color:#92400e}

  .section{margin-top:18px}
  .section-title{
    margin:0 0 10px;font-size:18px;font-weight:800;letter-spacing:.02em;
  }
  .section-title span{font-weight:600;color:var(--muted);font-size:15px;margin-left:6px}

  .stack{display:flex;flex-direction:column;gap:12px}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 14px 0;
    overflow:hidden;
  }
  .card.liyan{border-top:4px solid var(--liyan)}
  .card.gano{border-top:4px solid var(--gano)}
  .brand-head{display:flex;align-items:center;min-height:34px;margin-bottom:12px}
  .logo{display:block;object-fit:contain;object-position:left center}
  .logo.liyan{height:30px;width:auto}
  .logo.gano{height:26px;width:auto}

  .guest{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding:14px 14px;border-radius:10px;border:1px solid var(--line);margin-bottom:12px;
  }
  .guest.liyan{background:var(--liyan-soft);border-color:var(--liyan-line)}
  .guest.gano{background:var(--gano-soft);border-color:var(--gano-line)}
  .guest .lab{font-size:16px;font-weight:600;color:var(--muted)}
  .guest .n{
    font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;
  }
  .guest.liyan .n{color:var(--liyan)}
  .guest.gano .n{color:var(--gano)}

  .funnel{padding:4px 2px 8px}
  .funnel .frow{display:flex;align-items:flex-start;gap:0}
  .funnel .step{flex:1;text-align:center;min-width:0}
  .funnel .step .fn{
    font-size:28px;font-weight:800;line-height:1.1;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  }
  .funnel.liyan .step .fn{color:var(--liyan)}
  .funnel.gano .step .fn{color:var(--gano)}
  .funnel .step .fl{
    margin-top:6px;font-size:13px;font-weight:600;color:var(--muted);
  }
  .funnel .arw{
    flex:0 0 28px;text-align:center;color:#9ca3af;font-size:16px;line-height:1.2;
    padding-top:4px;font-weight:700;
  }

  .store-toggle{
    display:flex;width:calc(100% + 28px);margin:10px -14px 0;min-height:56px;
    align-items:center;justify-content:space-between;gap:10px;
    padding:0 14px 0 16px;border:0;border-top:1px solid var(--line);
    background:#fafbfc;color:var(--ink);
    font:inherit;font-size:17px;font-weight:700;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .store-toggle .toggle-right{
    display:flex;align-items:center;gap:8px;flex:0 0 auto;
  }
  .store-toggle .hint{
    font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.02em;
  }
  .store-toggle .chev-btn{
    flex:0 0 auto;width:40px;height:40px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    background:#fff;border:1.5px solid #d1d5db;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }
  .store-toggle .chev{
    font-size:12px;line-height:1;color:#374151;
    transition:transform .15s ease;display:block;
  }
  .store-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .store-toggle[aria-expanded="true"] .chev-btn{
    border-color:#9ca3af;background:#f3f4f6;
  }
  .store-panel{
    display:none;margin:0 -14px;padding:0 0 4px;
    border-top:1px solid var(--line);background:#fff;
  }
  .store-panel.open{display:block}
  .store-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px 10px 12px}
  table.store-tbl{
    width:100%;min-width:360px;border-collapse:collapse;font-size:15px;
  }
  table.store-tbl th,table.store-tbl td{
    padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;
  }
  table.store-tbl th{color:var(--muted);font-weight:700;font-size:13px}
  table.store-tbl td.num,table.store-tbl th.num{
    text-align:right;font-variant-numeric:tabular-nums;font-weight:700;
  }
  table.store-tbl td.dim{color:#c0c4cc;font-weight:400}
  table.store-tbl tr.zero td{color:#9ca3af;font-weight:400}
  table.store-tbl tfoot td{
    border-top:1px solid var(--line);border-bottom:none;
    font-weight:800;background:#fafbfc;
  }
  .empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:15px}
</style>
</head>

<script>
(function () {
  const REPORT_START = "2026-11-11";
  const TZ = "Asia/Shanghai";
  const LIVE_INTERVAL_MS = 10 * 60 * 1000;
  const LIVE_TIMEOUT_MS = 45000;
  const LOGO = {
    liyan: "./assets/brand/logo-liyan.svg",
    gano: "./assets/brand/logo-gano.svg",
  };
  const BRAND = { liyan: "丽妍雅集", gano: "GANO HAIR" };

  function liveApiUrl() {
    if (location.protocol === "file:") return null;
    return new URL("/api/alliance-live-snapshot", location.origin).href + "?t=" + Date.now();
  }

  const $ = (id) => document.getElementById(id);
  const dayInput = $("day");
  const reportEl = $("report");
  const liveStatus = $("liveStatus");
  const refreshBtn = $("refreshBtn");

  let state = {
    captureAt: null,
    source: "—",
    day: null,
    staff: [],
    coupons: [],
    funnel: [],
    storeClicks: [],
    clicksByDay: { light: [], scan: [] },
  };
  const openPanels = new Set();

  function nowInShanghai() {
    const fmt = new Intl.DateTimeFormat("en-CA", {
      timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
    });
    const parts = Object.fromEntries(fmt.formatToParts(new Date()).map((p) => [p.type, p.value]));
    return {
      date: `${parts.year}-${parts.month}-${parts.day}`,
      hour: Number(parts.hour),
      label: `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`,
    };
  }

  function sideOfStore(name) {
    const s = String(name || "");
    if (/丽妍|Rubis|雅集/i.test(s)) return "liyan";
    if (/GANO|奈造型/i.test(s)) return "gano";
    return "other";
  }

  function sideOfCompany(c) {
    const s = String(c || "");
    if (/丽妍/i.test(s)) return "liyan";
    if (/GANO/i.test(s)) return "gano";
    return "other";
  }

  function issueSideOf(c) {
    const bt = String(c.issueBrandType ?? c.brandType ?? "");
    if (bt === "1" || /丽妍/i.test(bt)) return "liyan";
    if (bt === "2" || /GANO/i.test(bt)) return "gano";
    return sideOfStore(issueStore(c));
  }

  function isVoid(c) {
    if (c.voidTime) return true;
    const st = String(c.status || c.state || c.couponStatus || "");
    return st === "5" || /作废|void|cancel|revoked|invalid/i.test(st);
  }

  function isRedeemed(c) {
    if (isVoid(c)) return false;
    if (c.redeemTime || c.usedTime || c.verifyTime) return true;
    const st = String(c.status || c.state || c.couponStatus || "");
    return st === "3" || st === "4" || /已核销|已使用|used|redeem/i.test(st);
  }

  function issueTime(c) {
    return String(c.claimTime || c.receiveTime || c.issueTime || c.issuedAt || c.grantTime || c.createTime || "");
  }

  function redeemTime(c) {
    return String(c.redeemTime || c.usedTime || c.verifyTime || "");
  }

  function issueStore(c) {
    return c.issueStoreName || c.issueShopName || c.fromStoreName || c.storeName || c.issueStore || "未知门店";
  }

  function redeemStore(c) {
    return c.redeemStoreName || c.redeemShopName || c.usedStoreName || c.verifyStoreName || c.redeemStore || "—";
  }

  function priceOf(c) {
    const n = Number(c.price ?? c.couponPrice ?? c.amount ?? c.facePrice);
    return Number.isFinite(n) ? n : 0;
  }

  function dayKey(ts) { return String(ts || "").slice(0, 10); }

  function sideBucket() {
    return {
      issueCount: 0, issueAmount: 0,
      redeemedOwnCount: 0, redeemedOwnAmount: 0,
      redeemCount: 0, redeemAmount: 0,
      guestCount: 0, guestAmount: 0,
      activeStaff: new Set(),
    };
  }

  function accumulateIssues(sides, coupons) {
    coupons.forEach((c) => {
      const side = issueSideOf(c);
      const b = sides[side] || sides.other;
      b.issueCount += 1;
      b.issueAmount += priceOf(c);
      const phone = c.issuerPhone || c.issueStaffPhone || c.staffPhone || "";
      if (phone) b.activeStaff.add(phone);
    });
  }

  function accumulateRedeems(sides, coupons) {
    coupons.forEach((c) => {
      const store = redeemStore(c);
      const redeemSide = sideOfStore(store);
      const issueSide = issueSideOf(c);
      const side = redeemSide !== "other" ? redeemSide : issueSide;
      const b = sides[side] || sides.other;
      const price = priceOf(c);
      b.redeemCount += 1;
      b.redeemAmount += price;
      const own = sides[issueSide] || sides.other;
      own.redeemedOwnCount += 1;
      own.redeemedOwnAmount += price;
      if (redeemSide === "liyan" && issueSide === "gano") {
        sides.liyan.guestCount += 1;
        sides.liyan.guestAmount += price;
      } else if (redeemSide === "gano" && issueSide === "liyan") {
        sides.gano.guestCount += 1;
        sides.gano.guestAmount += price;
      }
    });
  }

  function analyze(day) {
    const staff = state.staff || [];
    const raw = state.coupons || [];
    const coupons = raw.filter((c) => !isVoid(c) && dayKey(issueTime(c)) >= REPORT_START);
    const dayCoupons = coupons.filter((c) => dayKey(issueTime(c)) === day);
    const dayRedeems = coupons.filter((c) => isRedeemed(c) && dayKey(redeemTime(c)) === day);
    const allRedeems = coupons.filter((c) => isRedeemed(c));
    const sides = { liyan: sideBucket(), gano: sideBucket(), other: sideBucket() };
    const totals = { liyan: sideBucket(), gano: sideBucket(), other: sideBucket() };
    accumulateIssues(sides, dayCoupons);
    accumulateRedeems(sides, dayRedeems);
    accumulateIssues(totals, coupons);
    accumulateRedeems(totals, allRedeems);
    return { sides, totals, dayCoupons, dayRedeems, validCoupons: coupons };
  }

  function cumFunnelOf() {
    const map = {};
    (state.funnel || []).forEach((f) => {
      const bt = String(f.brandType ?? "");
      const side = bt === "1" ? "liyan" : bt === "2" ? "gano" : sideOfStore(f.brandName);
      map[side] = {
        light: Number(f.issueCount) || 0,
        scan: Number(f.scanCount) || 0,
        claim: Number(f.claimCount) || 0,
        redeem: Number(f.redeemCount) || 0,
      };
    });
    return map;
  }

  function dayFunnelOf(day, sides) {
    const by = state.clicksByDay || {};
    const sumDay = (rows, side, field) => {
      const bt = side === "liyan" ? "1" : side === "gano" ? "2" : "";
      return (rows || [])
        .filter((r) => String(r.date) === day && String(r.brandType) === bt)
        .reduce((n, r) => n + (Number(r[field] ?? r.n) || 0), 0);
    };
    const out = {};
    ["liyan", "gano"].forEach((k) => {
      const s = sides[k] || {};
      out[k] = {
        light: sumDay(by.light, k, "lightCount"),
        scan: sumDay(by.scan, k, "scanCount"),
        claim: Number(s.issueCount) || 0,
        redeem: Number(s.redeemedOwnCount) || 0,
      };
    });
    return out;
  }

  function shortStore(name) {
    return String(name || "")
      .replace(/^丽妍雅集\s*Rubis\s*SPA\s*[·・]\s*/i, "")
      .replace(/^GANO\s*HAIR\s*(Salon|\+奈造型设计)?\s*[·・]\s*/i, "")
      .replace(/^GANO\s*hair\s*造型\s*[·・]\s*/i, "") || String(name || "");
  }

  function storeRows(side, staff, claimCoupons, redeemCoupons) {
    const map = {};
    staff.forEach((s) => {
      const sd = sideOfCompany(s.companyName || s.brandName) || sideOfStore(s.storeName || s.shopName);
      if (sd !== side) return;
      const name = s.storeName || s.shopName;
      if (name) map[name] = map[name] || { store: name, claim: 0, redeemed: 0 };
    });
    (claimCoupons || []).forEach((c) => {
      if (issueSideOf(c) !== side) return;
      const name = issueStore(c);
      if (!map[name]) map[name] = { store: name, claim: 0, redeemed: 0 };
      map[name].claim += 1;
    });
    const redeemSrc = redeemCoupons != null
      ? redeemCoupons
      : (claimCoupons || []).filter((c) => isRedeemed(c));
    redeemSrc.forEach((c) => {
      if (issueSideOf(c) !== side) return;
      const name = issueStore(c);
      if (!map[name]) map[name] = { store: name, claim: 0, redeemed: 0 };
      map[name].redeemed += 1;
    });
    return Object.values(map).sort(
      (a, b) => b.claim - a.claim || b.redeemed - a.redeemed || a.store.localeCompare(b.store, "zh")
    );
  }

  function normStore(name) {
    return String(name || "")
      .replace(/[\s·・\-—_()（）]/g, "")
      .replace(/^丽妍雅集(rubis)?(spa)?/i, "")
      .replace(/^gano(hair)?(salon)?(\+奈造型设计)?/i, "")
      .toLowerCase();
  }

  function brandSideOfClick(r) {
    const brand = String(r.brandType ?? r.brandName ?? r.companyName ?? "");
    if (brand === "1") return "liyan";
    if (brand === "2") return "gano";
    if (/丽妍|Rubis/i.test(brand)) return "liyan";
    if (/GANO/i.test(brand)) return "gano";
    return "other";
  }

  function clicksByStoreOf(side) {
    const out = {};
    (state.storeClicks || []).forEach((r) => {
      if (brandSideOfClick(r) !== side) return;
      const name = r.shopName || r.storeName || r["门店"] || r["店铺"];
      if (!name) return;
      const light = r.lightCount ?? r.issueCount ?? r["亮码"] ?? r["亮码次数"];
      const scan = r.scanCount ?? r["扫码"] ?? r["扫码次数"];
      out[normStore(name)] = {
        light: light === null || light === undefined || light === "" ? null : Number(light),
        scan: scan === null || scan === undefined || scan === "" ? null : Number(scan),
      };
    });
    return out;
  }

  function clicksByStoreOfDay(side, day) {
    const by = state.clicksByDay || {};
    const out = {};
    const bump = (rows, field) => {
      (rows || []).forEach((r) => {
        if (String(r.date) !== day) return;
        if (brandSideOfClick(r) !== side) return;
        const name = r.shopName || r.storeName || r["门店"] || r["店铺"];
        if (!name) return;
        const k = normStore(name);
        if (!out[k]) out[k] = { light: 0, scan: 0 };
        out[k][field] += Number(r[field === "light" ? "lightCount" : "scanCount"] ?? r.n) || 0;
      });
    };
    bump(by.light, "light");
    bump(by.scan, "scan");
    return out;
  }

  function renderFunnel(cls, f) {
    if (!f) return `<div class="funnel ${cls}"><div class="empty">暂无漏斗</div></div>`;
    return `
      <div class="funnel ${cls}">
        <div class="frow">
          <div class="step"><div class="fn">${f.light}</div><div class="fl">亮码</div></div>
          <div class="arw">→</div>
          <div class="step"><div class="fn">${f.scan}</div><div class="fl">扫码</div></div>
          <div class="arw">→</div>
          <div class="step"><div class="fn">${f.claim}</div><div class="fl">领取</div></div>
          <div class="arw">→</div>
          <div class="step"><div class="fn">${f.redeem}</div><div class="fl">被核销</div></div>
        </div>
      </div>`;
  }

  function renderStoreTable(rows, clicksByStore, fillZero) {
    const pick = (store, key) => {
      const hit = clicksByStore && clicksByStore[normStore(store)];
      if (hit) {
        const v = hit[key];
        if (v === null || v === undefined || v === "" || Number.isNaN(Number(v))) {
          return fillZero ? 0 : null;
        }
        return Number(v);
      }
      return fillZero ? 0 : null;
    };
    const cell = (v) => (v === null ? `<td class="num dim">—</td>` : `<td class="num">${v}</td>`);
    const hasClicks = fillZero
      || rows.some((r) => pick(r.store, "light") !== null || pick(r.store, "scan") !== null);
    const rowActive = (r) =>
      (pick(r.store, "light") || 0) + (pick(r.store, "scan") || 0) + r.claim + r.redeemed > 0;
    const body = rows.map((r) => `
      <tr class="${rowActive(r) ? "" : "zero"}">
        <td>${shortStore(r.store)}</td>
        ${cell(pick(r.store, "light"))}
        ${cell(pick(r.store, "scan"))}
        <td class="num">${r.claim}</td>
        <td class="num">${r.redeemed}</td>
      </tr>`).join("");
    const sum = rows.reduce((n, r) => n + r.claim, 0);
    const redeemed = rows.reduce((n, r) => n + r.redeemed, 0);
    const sumLight = rows.reduce((n, r) => n + (pick(r.store, "light") || 0), 0);
    const sumScan = rows.reduce((n, r) => n + (pick(r.store, "scan") || 0), 0);
    return `
      <div class="store-scroll">
        <table class="store-tbl">
          <thead><tr>
            <th>门店</th><th class="num">亮码</th><th class="num">扫码</th>
            <th class="num">领取</th><th class="num">被核销</th>
          </tr></thead>
          <tbody>${body || `<tr><td colspan="5" class="empty">暂无门店</td></tr>`}</tbody>
          <tfoot><tr>
            <td>合计</td>
            ${cell(hasClicks ? sumLight : null)}
            ${cell(hasClicks ? sumScan : null)}
            <td class="num">${sum}</td><td class="num">${redeemed}</td>
          </tr></tfoot>
        </table>
      </div>`;
  }

  function renderBrandCard(cls, side, funnel, panelId, storeHtml) {
    const open = openPanels.has(panelId);
    return `
      <article class="card ${cls}">
        <div class="brand-head">
          <img class="logo ${cls}" src="${LOGO[cls]}" alt="${BRAND[cls]}" />
        </div>
        <div class="guest ${cls}">
          <div class="lab">获客</div>
          <div class="n">${side.guestCount}</div>
        </div>
        ${renderFunnel(cls, funnel)}
        <button type="button" class="store-toggle" data-panel="${panelId}" aria-expanded="${open ? "true" : "false"}">
          <span>门店明细</span>
          <span class="toggle-right">
            <span class="hint">点击查看</span>
            <span class="chev-btn" aria-hidden="true"><span class="chev">▼</span></span>
          </span>
        </button>
        <div class="store-panel${open ? " open" : ""}" data-panel-body="${panelId}">
          ${storeHtml}
        </div>
      </article>`;
  }

  function render() {
    let day = dayInput.value || nowInShanghai().date;
    if (day < REPORT_START) day = REPORT_START;
    if (dayInput.value !== day) dayInput.value = day;
    state.day = day;

    const a = analyze(day);
    const CF = cumFunnelOf();
    const DF = dayFunnelOf(day, a.sides);
    const hasDayClicks = !!(state.clicksByDay
      && ((state.clicksByDay.light && state.clicksByDay.light.length)
        || (state.clicksByDay.scan && state.clicksByDay.scan.length)));
    const LDAY = storeRows("liyan", state.staff, a.dayCoupons, a.dayRedeems);
    const GDAY = storeRows("gano", state.staff, a.dayCoupons, a.dayRedeems);
    const LROWS = storeRows("liyan", state.staff, a.validCoupons);
    const GROWS = storeRows("gano", state.staff, a.validCoupons);

    reportEl.innerHTML = `
      <section class="section">
        <h2 class="section-title">当日<span>${day}</span></h2>
        <div class="stack">
          ${renderBrandCard("liyan", a.sides.liyan, DF.liyan, "day-liyan",
            renderStoreTable(LDAY, clicksByStoreOfDay("liyan", day), hasDayClicks))}
          ${renderBrandCard("gano", a.sides.gano, DF.gano, "day-gano",
            renderStoreTable(GDAY, clicksByStoreOfDay("gano", day), hasDayClicks))}
        </div>
      </section>
      <section class="section">
        <h2 class="section-title">活动累计<span>自 ${REPORT_START}</span></h2>
        <div class="stack">
          ${renderBrandCard("liyan", a.totals.liyan, CF.liyan, "cum-liyan",
            renderStoreTable(LROWS, clicksByStoreOf("liyan"), true))}
          ${renderBrandCard("gano", a.totals.gano, CF.gano, "cum-gano",
            renderStoreTable(GROWS, clicksByStoreOf("gano"), true))}
        </div>
      </section>`;
  }

  reportEl.addEventListener("click", (ev) => {
    const btn = ev.target.closest(".store-toggle");
    if (!btn || !reportEl.contains(btn)) return;
    const id = btn.getAttribute("data-panel");
    if (!id) return;
    if (openPanels.has(id)) openPanels.delete(id);
    else openPanels.add(id);
    const open = openPanels.has(id);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    const panel = reportEl.querySelector(`[data-panel-body="${id}"]`);
    if (panel) panel.classList.toggle("open", open);
  });

  function snapshotToData(s) {
    if (!s || !Array.isArray(s.coupons)) throw new Error("快照无 coupons");
    if (/^演示数据|结构对齐后台/.test(s.source || "")) throw new Error("拒绝演示数据快照");
    return {
      staff: s.staff || [],
      coupons: s.coupons || [],
      funnel: s.funnelCumulative || [],
      storeClicks: s.storeClicks || [],
      clicksByDay: s.clicksByDay || s.byDay || { light: [], scan: [] },
      source: s.source || ("后台已核对快照 · " + (s.capturedAt || "")),
      captureAt: s.capturedAt || null,
    };
  }

  function loadEmbeddedSnapshot() {
    const el = document.getElementById("live-snapshot");
    if (!el || !el.textContent.trim()) throw new Error("缺少 #live-snapshot");
    return snapshotToData(JSON.parse(el.textContent));
  }

  function setLiveStatus(text, kind) {
    liveStatus.textContent = text;
    liveStatus.className = "live-status" + (kind ? " " + kind : "");
  }

  function applyData(data) {
    if (/^演示数据|结构对齐后台/.test(String(data.source || ""))) {
      throw new Error("拒绝写入演示数据");
    }
    state.staff = data.staff || [];
    state.coupons = data.coupons || [];
    state.funnel = data.funnel || [];
    state.storeClicks = data.storeClicks || [];
    state.clicksByDay = data.clicksByDay || { light: [], scan: [] };
    state.source = data.source || "—";
    state.captureAt = data.captureAt || nowInShanghai().label;
    render();
  }

  let liveTimer = null;
  let liveBusy = false;

  async function fetchLiveSnapshot() {
    const url = liveApiUrl();
    if (!url) throw new Error("请用本地服务打开本页（不要直接打开文件）");
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), LIVE_TIMEOUT_MS);
    try {
      const res = await fetch(url, { cache: "no-store", signal: ctrl.signal });
      const raw = await res.json();
      if (!res.ok || raw.ok === false) throw new Error((raw && raw.error) || ("HTTP " + res.status));
      return snapshotToData(raw);
    } catch (err) {
      if (err && err.name === "AbortError") throw new Error("刷新超时");
      throw err;
    } finally {
      clearTimeout(timer);
    }
  }

  async function refreshLive(reason) {
    if (liveBusy) {
      setLiveStatus("正在刷新…", "busy");
      return;
    }
    liveBusy = true;
    refreshBtn.disabled = true;
    setLiveStatus(reason === "auto" ? "定时刷新中…" : "刷新中…", "busy");
    try {
      applyData(await fetchLiveSnapshot());
      const next = new Date(Date.now() + LIVE_INTERVAL_MS);
      const hh = String(next.getHours()).padStart(2, "0");
      const mm = String(next.getMinutes()).padStart(2, "0");
      setLiveStatus(`已更新 · 下次约 ${hh}:${mm}`, "ok");
    } catch (err) {
      setLiveStatus("刷新失败（仍显示当前数据）", "err");
    } finally {
      liveBusy = false;
      refreshBtn.disabled = false;
    }
  }

  function startLivePolling() {
    if (liveTimer) clearInterval(liveTimer);
    liveTimer = setInterval(() => refreshLive("auto"), LIVE_INTERVAL_MS);
  }

  async function boot() {
    const now = nowInShanghai();
    dayInput.min = REPORT_START;
    dayInput.value = now.date < REPORT_START ? REPORT_START : now.date;
    try {
      applyData(loadEmbeddedSnapshot());
      setLiveStatus("已加载本地快照", "ok");
    } catch (e) {
      reportEl.innerHTML = `<div class="empty">加载失败</div>`;
      setLiveStatus(String(e.message || e), "err");
    }
    await refreshLive("boot");
    startLivePolling();
  }

  dayInput.addEventListener("change", render);
  refreshBtn.addEventListener("click", () => refreshLive("manual"));
  boot();
})();
</script>
</body>
</html>
